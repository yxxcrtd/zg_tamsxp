<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{SvrPerProDeclareInfo002}">产品申报信息登记维护新建</title>
    <style type="text/css">
        .layui-form-radio {
            margin: 0;
            padding-right: 0;
        }

        .layui-form-radio>i {
            font-size: 18px;
            margin-right: 2px;
        }

        .form-day-wrap {
            float: left;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <!-- 隐藏字段 金融产品代码 -->
            <input type="hidden"  id="statusValid" name="statusValid" class="layui-input form-input" data-th-value="${entity?.statusValid}">
            <input type="text" name="declareUuid" id="declareUuid" data-th-value='${entity?.declareUuid}' hidden>
            <input type="text" name="workflowId" id="workflowId" data-th-value='${entity?.workflowId}' hidden>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des">产品申报参数基本信息</span>（<span class="star-sign">*</span>必填）<i
                            class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.prodName}">产品名称</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" name="prodName" id="prodName"
                                           class="layui-input form-input" maxlength="120"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${entity?.prodName}' required>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.prodInsId}">行内标识码</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="prodInsId" th:name="prodInsId"
                                           class="layui-input form-input"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value="${entity?.prodInsId}" data-textrange="0" maxlength="60"
                                           data-th-required="true" />
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.prodBrand}">产品品牌</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="prodBrand" th:name="prodBrand"
                                           maxlength="120" data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value="${entity?.prodBrand}" class="layui-input form-input" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.prodStage}">产品期次</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="prodStage" th:name="prodStage"
                                           class="layui-input form-input" onkeypress="return event.keyCode>=48&&event.keyCode<=57"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value="${entity?.prodStage}" data-textrange="0" maxlength="4"
                                           data-th-required="true" />
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.issuePartyId}">发行机构代码</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="issuePartyId" th:name="issuePartyId"
                                           class="layui-input form-input"
                                           data-th-value="${entity?.issuePartyId}?:${SVR_ISSUE_PARTY_ID}"
                                           data-th-required="true" disabled="disabled"/>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.profitType}">收益类型</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="profitType" name="profitType"
                                            class="layui-input form-input input-select"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-initValue='${entity?.profitType}'
                                            data-th-data-result="${SVR_PROD_PROFIT_TYPE}" required>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.approverName}">产品审批人</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="approverId" th:name="approverId"
                                           class="layui-input form-input" style="width:70%;display:inline-block;"
                                           data-th-value="${entity?.approverId}" maxlength="30"
                                           placeholder="请输入18位有效证件"  required/>
                                    <input type="text" th:id="approverName" th:name="approverName"
                                           class="layui-input form-input" style="width:30%;display:inline-block;"
                                           data-th-value="${entity?.approverName}" maxlength="200"
                                           placeholder="请输入姓名" required/>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.designerName}">产品设计人</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="designerId" th:name="designerId"
                                           class="layui-input form-input" style="width:70%;display:inline-block;" maxlength="30"
                                           data-th-value="${entity?.designerId}" placeholder="请输入18位有效证件" required/>
                                    <input type="text" th:id= "designerName" th:name="designerName"
                                           class="layui-input form-input" style="width:30%;display:inline-block;"
                                           data-th-value="${entity?.designerName}" maxlength="200"
                                           placeholder="请输入姓名" required/>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.managerName}">投资经理</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="managerId" th:name="managerId"
                                           class="layui-input form-input" style="width:70%;display:inline-block;" maxlength="30"
                                           data-th-value="${entity?.managerId}" placeholder="请输入18位有效证件" required/>
                                    <input type="text" th:id= "managerName" th:name="managerName"
                                           class="layui-input form-input" style="width:30%;display:inline-block;"
                                           data-th-value="${entity?.managerName}" maxlength="200"
                                           placeholder="请输入姓名" required/>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.liaisonName}">业务联络人姓名</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="liaisonName" th:name="liaisonName"
                                           maxlength="32" class="layui-input form-input"
                                           data-th-value="${entity?.liaisonName}" placeholder="请输入内容"  required/>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.liaisonTel}">业务联络人座机</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="liaisonTel" th:name="liaisonTel"
                                           class="layui-input form-input" maxlength="30"
                                           data-th-value="${entity?.liaisonTel}" placeholder="请输入内容"  required/>
                                    <span id="liaisonTel_showRule"
                                       class="layui-btn layui-btn-sm form-input-text">规则</span>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.liaisonMobile}">业务联络人手机</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="liaisonMobile" th:name="liaisonMobile"
                                           class="layui-input form-input" maxlength="11"
                                           data-th-value="${entity?.liaisonMobile}" placeholder="请输入内容"   required/>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.liaisonEmail}">业务联络人邮箱</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="liaisonEmail" th:name="liaisonEmail"
                                           class="layui-input form-input" maxlength="50"
                                           data-th-value="${entity?.liaisonEmail}" placeholder="请输入内容" data-th-required="true" />
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.termtype}">产品期限</label>
                                <div class="layui-input-inline input-inline">
                                    <div class="layui-input-inline input-inline">
                                        <select name="termtype" id="termtype"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.termtype}'
                                                data-th-data-result="${SVR_PRODUCT_TERM}" required>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.excFinSector}">是否金融同业专属</label>
                                <div class="layui-input-inline input-inline">
                                    <select th:id="excFinSector" th:name="excFinSector"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${SVR_YES_OR_NO}" placeholder="请输入内容"
                                            data-th-initValue="${entity?.excFinSector}" data-th-placeholder="#{SysCommon.placeholder}" data-th-required="true">
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.investArae}">资金投向地区</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="investArae" th:name="investArae"
                                           data-th-data-result="${SVR_SALEAREA_DECLARE}"
                                           data-th-initValue="${entity?.investArae}" class="layui-input form-input input-checkbox" data-th-required="true" />
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.investCountry}">产品投资国家或地区</label>
                                <div class="layui-input-inline input-inline">
                                    <select th:id="investCountry" th:name="investCountry"
                                            class="layui-input form-input input-select" multiple="multiple"
                                            data-th-data-result="${SVR_COUNTRY_AREA}" placeholder="请输入内容"
                                            data-th-initValue="${entity?.investCountry}" data-th-placeholder="#{SysCommon.placeholder}"
                                    >
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.finanSerModel}">理财业务服务模式</label>
                                <div class="layui-input-inline input-inline">
                                    <select th:id="finanSerModel" th:name="finanSerModel"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${SVR_SERVICEMODE}" placeholder="请输入内容"
                                            data-th-initValue="${entity?.finanSerModel}" data-th-placeholder="#{SysCommon.placeholder}"
                                    >
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.operateMode}">产品运作模式</label>
                                <div class="layui-input-inline input-inline">
                                    <select th:id="operateMode" th:name="operateMode"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${SVR_OPERATEMODE_DECLARE}" placeholder="请输入内容" required
                                            data-th-initValue="${entity?.operateMode}" data-th-placeholder="#{SysCommon.placeholder}">
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.raiseType}">募集方式</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:name="raiseType" th:id="raiseType"
                                           class="layui-input form-input input-checkbox" required
                                           data-th-initValue='${entity?.raiseType}'
                                           data-th-data-result="${SVR_RAISE_TYPE}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.cmmode}">产品资产配置方式</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="cmmode" name="cmmode" class="layui-input form-input input-select"
                                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-data-result='${SVR_CMMODE}'
                                           data-th-value="${entity?.cmmode}" required>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.pmmode}">产品管理模式</label>
                                <div class="layui-input-inline input-inline">
                                    <select th:id="pmmode" th:name="pmmode"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${SVR_PROD_MANAGE}" placeholder="请输入内容"
                                            data-th-initValue="${entity?.pmmode}" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-required="true">
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.mname}">实际管理人名称</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="mname" th:name="mname"
                                           data-th-value="${entity?.mname}" maxlength=120
                                           class="layui-input form-input" placeholder="请输入内容" />
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.pricedMode}">产品定价方式</label>
                                <div class="layui-input-inline input-inline">
                                    <select th:id="pricedMode" th:name="pricedMode"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${SVR_PRODVALUETYPE}" placeholder="请输入内容"
                                            data-th-initValue="${entity?.pricedMode}"
                                            data-th-placeholder="#{SysCommon.placeholder}" data-th-required="true">
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.ivstorientation}">产品投资性质</label>
                                <div class="layui-input-inline input-inline">
                                    <select name="ivstorientation" id="ivstorientation"
                                            class="layui-input form-input input-select"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-initValue='${entity?.ivstorientation}'
                                            data-th-data-result="${INVEST_TYPE}" required>
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.yield}">业绩比较基准</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="yield" th:name="yield" maxlength="8" data-textrange='5'
                                           data-th-value="${entity?.yield}" class="layui-input form-input text-number" required
                                           data-th-placeholder="#{SysCommon.placeholder}"><span
                                        class="input-right-show">%</span>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.cashManaCate}">是否现金管理类</label>
                                <div class="layui-input-inline input-inline">
                                    <select th:id="cashManaCate" th:name="cashManaCate"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${SVR_YES_OR_NO}" placeholder="请输入内容"
                                            data-th-initValue="${entity?.cashManaCate}" data-th-placeholder="#{SysCommon.placeholder}" >
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.isShortTerm}">是否设置最短持有期限</label>
                                <div class="layui-input-inline input-inline">
                                    <select th:id="isShortTerm" th:name="isShortTerm"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${SVR_YES_OR_NO}" placeholder="请输入内容"
                                            data-th-initValue="${entity?.isShortTerm}" data-th-placeholder="#{SysCommon.placeholder}">
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.shortTerm}">最短持有期限(天)</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="shortTerm" th:name="shortTerm"
                                           class="layui-input form-input text-number"
                                           data-th-value="${entity?.shortTerm}"
                                           data-textrange="0" maxlength="5"
                                           onkeyup="this.value=this.value.replace(/\D/g,'')"
                                           onafterpaste="this.value=this.value.replace(/\D/g,'')"
                                           placeholder="请输入内容"/>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.isFreeRedem}">最短持有期后是否自由赎回</label>
                                <div class="layui-input-inline input-inline">
                                    <select th:id="isFreeRedem" th:name="isFreeRedem"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${SVR_YN_REDEM}" placeholder="请输入内容"
                                            data-th-initValue="${entity?.isFreeRedem}" data-th-placeholder="#{SysCommon.placeholder}">
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.saleArea}">产品销售区域</label>
                                <div class="layui-input-inline input-inline">
                                    <select th:id="saleArea" th:name="saleArea"
                                            class="layui-input form-input input-select" multiple="multiple"
                                            data-th-data-result="${SVR_BUY_PLACE}"
                                            placeholder="请输入内容"
                                            data-th-initValue="${entity?.saleArea}"
                                            data-th-placeholder="#{SysCommon.placeholder}" data-th-required="true">
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.saleAmtStr}">起点销售金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="saleAmtStr" th:name="saleAmtStr"
                                           data-th-value="${entity?.saleAmtStr}" maxlength=15
                                           class="layui-input form-input text-number" placeholder="请输入内容" required/>
                                    <span class="input-right-show">元</span>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.saleFeeRate}">销售手续费率%</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="saleFeeRate" th:name="saleFeeRate"
                                           data-textrange="5" maxlength="8"
                                           data-th-value="${entity?.saleFeeRate}"
                                           class="layui-input form-input text-number" placeholder="请输入内容" required>
                                    <span class="input-right-show">%</span>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.raiseCcy}">募集币种</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="raiseCcy" name="raiseCcy" class="layui-input form-input input-select"
                                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-data-result='${CCY}'
                                           data-th-value = "${entity?.raiseCcy}"
                                           required />

                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.cashPrinCcy}">兑付本金币种</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="cashPrinCcy" name="cashPrinCcy" class="layui-input form-input input-select"
                                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-data-result='${CCY}'
                                           data-th-value = "${entity?.cashPrinCcy}"
                                           required />
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrPerProDeclareInfo002.cashProfCcy}">兑付收益币种</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="cashProfCcy" name="cashProfCcy" class="layui-input form-input input-select"
                                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-data-result='${CCY}'
                                           data-th-value = "${entity?.cashProfCcy}"
                                           required />
                                </div>
                            </div>
                        </div>
