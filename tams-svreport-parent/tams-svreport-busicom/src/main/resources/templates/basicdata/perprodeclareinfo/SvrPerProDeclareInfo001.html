<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{SvrPerProDeclareInfo001}">产品新建管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area" >
            <a id="SvrPerProDeclareInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="SvrPerProDeclareInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
            <a id="SvrPerProDeclareInfo001_btn_import" class="layui-btn layui-btn-sm btn-import"><i class="iconfont icon-import"></i>导入</a>
            <a id="SvrPerProDeclareInfo001_btn_batchFileUpload" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-sent"></i>附件上传</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{SvrPerProDeclareInfo001.prodName}">产品名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="prodName" id="prodName"
                                   class="layui-input form-input input-lenovoselect" allowClear="true"
                                   placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-idfield="code" data-keyfield="code"
                                   data-effectivefieldsalias='{"code":"产品名称","shortName":"产品名称"}'
                                   data-th-data-url="@{/basicdata/perprodeclareinfo/SvrPerProDeclareInfo001/queryProdInfo}"/>
                        </div>
                    </div>
                    <div
                            class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{SvrPerProDeclareInfo001.termtype}">产品期限</label>
                        <div class="layui-input-inline input-inline">
                            <select name="termtype" id="termtype"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${SVR_PRODUCT_TERM}" >
                            </select>
                        </div>
                    </div>
                    <div
                            class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{SvrPerProDeclareInfo001.operateMode}">产品运作模式</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" name="operateMode" id="operateMode"
                                    class="layui-input form-input input-select" allowClear="true"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption=false
                                    data-th-data-result="${SVR_OPERATEMODE_DECLARE}">
                            </select>
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div
                            class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{SvrPerProDeclareInfo001.raisePstrdate}">募集起始日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="raisePstrdate" name='raisePstrdate'
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间" allowClear="true">
                        </div>
                    </div>
                    <div
                            class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{SvrPerProDeclareInfo001.status}">数据状态</label>
                        <div class="layui-input-inline input-inline">
                        <input type="text" id="status" name="status"
                               class="layui-input form-input input-select" placeholder="请选择"
                               data-th-data-result="${MAINTAIN_STATUS}" allowClear="true">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script
            data-th-src="@{/js/basicdata/perprodeclareinfo/SvrPerProDeclareInfo001.js}"
            type="text/javascript"></script>
    <script data-th-inline="javascript" type="text/javascript">
        var issueStatusC = /*[[${issueStatusC}]]*/;
        var statusValidE = /*[[${statusValidE}]]*/;
        var issueStatusCName = /*[[${issueStatusCName}]]*/;
    </script>
</div>
</body>
</html>
