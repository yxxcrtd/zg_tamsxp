<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .buss-inline-wrap .select2-container {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">委外投资——协议方式</span>（<span class="star-sign">*</span>必填）<i
                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">


            <div class="layui-form-item">


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-utext="#{SvrBussRepOutInvestAgrInfo.assetName}">委外投资协议名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetName|"
                               th:value="${entity?.assetName}" disabled="disabled"
                               data-fixtype="2" class="layui-input form-input" required/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOutInvestAgrInfo.assetId}">委外投资协议编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetId|" th:name="|${entityName}.assetId|"
							   data-th-value="${entity?.assetId}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepOutInvestAgrInfo.trustee}" style="line-height: normal!important;">受托人</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_trustee|" th:name="|${entityName}.trustee|"
                               th:value="${entity?.trustee}" class="layui-input form-input" required="required"
                               maxlength="100"/>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-utext="#{SvrBussRepOutInvestAgrInfo.managerId}" style="line-height: normal!important;">实际管理人</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_managerId|" th:name="|${entityName}.managerId|"
							   th:value="${entity?.managerId}" class="layui-input form-input" required="required"
							   maxlength="100"/>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-utext="#{SvrBussRepOutInvestAgrInfo.trusteeId}" style="line-height: normal!important;">托管人</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_trusteeId|" th:name="|${entityName}.trusteeId|"
							   th:value="${entity?.trusteeId}" class="layui-input form-input" required="required"
							   maxlength="100"/>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-utext="#{SvrBussRepOutInvestAgrInfo.amt}"
						   style="line-height: normal!important;">委托投资金额</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_amt|"
							   th:name="|${entityName}.amt|" placeholder="请输入内容" data-pattern=""
							   data-fixtype="2" class="layui-input form-input text-money"
							   th:value="${entity?.amt}" data-moneymemory="" required
							   data-th-data-textrange="2">
					</div>
				</div>
			</div>



			<div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepOutInvestAgrInfo.truActType}">资金实际投向</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_truActType|" th:name="|${entityName}.truActType|"
                                data-th-data-result="${SVR_TRU_ACT_TYPE}" th:initValue="${entity?.truActType}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepOutInvestAgrInfo.investType}">资金运用方式</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_investType|"
                               th:name="|${entityName}.investType|" th:value="${entity?.investType}"
                               class="layui-input form-input" maxlength="150" required/>
                    </div>
                </div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-utext="#{SvrBussRepOutInvestAgrInfo.capUseIndu}">资金运用行业一级分类</label>
					<div class="layui-input-inline input-inline">
						<select id="investcapUseIndu" th:name="|${entityName}.capUseIndu|"
								data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
								th:initValue="${entity?.capUseIndu}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								childrenIds="investcapUseInduLevel2"
								data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
					</div>
				</div>


            </div>
            <div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-utext="#{SvrBussRepOutInvestAgrInfo.capUseInduLevel2}">资金运用行业二级分类</label>
					<div class="layui-input-inline input-inline">
						<select th:id="investcapUseInduLevel2" th:name="|${entityName}.capUseInduLevel2|"
								data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
								th:initValue="${entity?.capUseInduLevel2}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								parentIds="investcapUseIndu"
								data-th-placeholder="#{SysCommon.placeholder}" >
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						   data-th-utext="#{SvrBussRepOutInvestAgrInfo.proProperty}">委外投资属性</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_proProperty|" th:name="|${entityName}.proProperty|"
								data-th-data-result="${SVR_PRO_STYLE}"
								th:initValue="${entity?.proProperty}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
					</div>
				</div>


				<div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepOutInvestAgrInfo.rateFlag}"
                           style="line-height: normal!important;">是否有预期收益率</label>
                    <div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_rateFlag|" th:name="|${entityName}.rateFlag|"
								th:initValue="${entity?.rateFlag}" class="layui-input form-input input-select"
								placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
								data-th-data-result="${SVR_YES_OR_NO}">
						</select>
                    </div>
                </div>
			</div>


            <div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-utext="#{SvrBussRepOutInvestAgrInfo.maxRate}"
						   style="line-height: normal!important;">预期最高收益率</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_maxRate|"
							   th:name="|${entityName}.maxRate|" placeholder="请输入内容" data-pattern=""
							   data-fixtype="2" class="layui-input form-input text-number"
							   th:value="${entity?.maxRate}" data-th-data-textrange="5">
					</div>
				</div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepOutInvestAgrInfo.minRate}"
                           style="line-height: normal!important;">预期最低收益率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_minRate|"
                               th:name="|${entityName}.minRate|" placeholder="请输入内容" data-pattern=""
                               data-fixtype="2" class="layui-input form-input text-number"
                               th:value="${entity?.minRate}" data-th-data-textrange="5">
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepOutInvestAgrInfo.mgrFeeRate}"
                           style="line-height: normal!important;">管理费率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_mgrFeeRate|"
                               th:name="|${entityName}.mgrFeeRate|" placeholder="请输入内容" data-pattern=""
                               data-fixtype="2" class="layui-input form-input text-number"
                               th:value="${entity?.mgrFeeRate}" data-th-data-textrange="5" required>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-utext="#{SvrBussRepOutInvestAgrInfo.truFeeRate}"
						   style="line-height: normal!important;">托管费率%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_truFeeRate|" th:name="|${entityName}.truFeeRate|"
							   placeholder="请输入内容" data-pattern="" data-fixtype="2"
							   class="layui-input form-input text-number" th:value="${entity?.truFeeRate}"
							   data-th-data-textrange="5" required>
					</div>
				</div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepOutInvestAgrInfo.tradeFeeRate}"
                           style="line-height: normal!important;">交易相关合计费率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_tradeFeeRate|"
                               th:name="|${entityName}.tradeFeeRate|" placeholder="请输入内容" data-pattern=""
                               data-fixtype="2" class="layui-input form-input text-number"
                               th:value="${entity?.tradeFeeRate}" data-th-data-textrange="5" required>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepOutInvestAgrInfo.agencyFeeRate}"
                           style="line-height: normal!important;">中介服务机构合计费率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_agencyFeeRate|"
                               th:name="|${entityName}.agencyFeeRate|" placeholder="请输入内容" data-pattern=""
                               data-fixtype="2" class="layui-input form-input text-number"
                               th:value="${entity?.agencyFeeRate}" data-th-data-textrange="5" required>
                    </div>
                </div>

            </div>



            <div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-utext="#{SvrBussRepOutInvestAgrInfo.otherFeeRate}"
						   style="line-height: normal!important;">其他合计费率%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_otherFeeRate|"
							   th:name="|${entityName}.otherFeeRate|" placeholder="请输入内容" data-pattern=""
							   data-fixtype="2" class="layui-input form-input text-number"
							   th:value="${entity?.otherFeeRate}" data-th-data-textrange="5" required>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repPppflag}">公共PPP</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_pppflag|" th:name="|${entityName}.pppflag|"
								th:initValue="${entity?.pppflag}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_YES_OR_NO}" required>
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repBondtostockFlag}">是否投向市场化债转股相关产品的部分</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_bondtostockFlag|" th:name="|${entityName}.bondtostockFlag|"
								th:initValue="${entity?.bondtostockFlag}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_YES_OR_NO}" required>
						</select>
					</div>
				</div>

            </div>
			<!--add by yjp 估值穿透开发--监管报送资产基本信息维护导入功能合并华夏字段start -->
			<div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType1}" >新人行一级分类</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_pbcAssetType1|" th:name="|${entityName}.pbcAssetType1|" th:initValue="${entity?.pbcAssetType1}"
								th:childrenIds="|${entityName}_pbcAssetType2|" required
								class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_1}">
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType2}" >新人行二级分类</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_pbcAssetType2|" th:name="|${entityName}.pbcAssetType2|" th:initValue="${entity?.pbcAssetType2}"
								th:childrenIds="|${entityName}_pbcAssetType3|" th:parentIds="|${entityName}_pbcAssetType1|" required
								class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_2}">
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType3}" >新人行三级分类</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_pbcAssetType3|" th:name="|${entityName}.pbcAssetType3|" th:initValue="${entity?.pbcAssetType3}"
								th:parentIds="|${entityName}_pbcAssetType2|" required
								class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_3}">
						</select>
					</div>
				</div>

			</div>
			<!--add by yjp 估值穿透开发--监管报送资产基本信息维护导入功能合并华夏字段end -->

            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width: 100% !important;">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepOutInvestAgrInfo.remark}"
                           style="width: 12.55%;">备注</label>
                    <div class="layui-input-inline input-inline" style="width: 86% !important;">
                        <input th:id="|${entityName}_remark|" th:name="|${entityName}.remark|" placeholder="请输入内容"
                               class="layui-input form-input" data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-value="${entity?.remark}" maxlength="128" style="width: 100%!important;">
                        </input>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
    var entityName_SvrBussRepOutInvestAgrInfo = [[${entityName}]];
    var FLAG_YES = /*[[${FLAG_YES}]]*/'';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/trust/SvrBussRepOutInvestAgrInfo.js}"
        type="text/javascript"></script>
</body>

</html>
