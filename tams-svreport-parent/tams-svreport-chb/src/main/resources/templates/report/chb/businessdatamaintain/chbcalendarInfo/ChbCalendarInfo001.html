<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title>交易日历信息</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="ChbCalendarInfo001_btn_import" class="layui-btn layui-btn-sm ">导入</a>
            <a id="ChbCalendarInfo001_btn_sethday" class="layui-btn layui-btn-sm">设为节假日</a>
            <a id="ChbCalendarInfo001_btn_setwday" class="layui-btn layui-btn-sm">设为工作日</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">市场日历类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="calendarType" name="calendarType"
                                class="layui-input form-input input-select" allowClear="true" placeholder="请选择市场日历类型" data-th-placeholder="#{SysCommon.placeholder}" multiple=”true” data-th-data-result="${BATCH_QUARTZ_SKIP_HOLIDAY_MARKET_CAL_TYPE}" showAll='true'>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" >是否节假日</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ishDay" name="ishDay"
                                class="layui-input form-input input-select select2-hidden-accessible" allowclear="true"
                                placeholder="请选择节假日标志" data-th-placeholder="#{SysCommon.placeholder}" aria-hidden="true" data-th-data-result="${IS_HOLIDAY}" formatoption = "true">
                                </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id='cdate' name='cdate' class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" >数据状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="status" name="status"
                                    class="layui-input form-input input-select select2-hidden-accessible" allowclear="true"
                                    placeholder="请选数据状态" data-th-placeholder="#{SysCommon.placeholder}" aria-hidden="true" data-th-data-result="${MAINTAIN_STATUS}" formatoption = "true">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
        	var yes = /*[[${_yes}]]*/'';
            var no = /*[[${_no}]]*/'';
        </script>
        <script data-th-src="@{/js/report/chb/businessdatamaintain/chbcalendarInfo/ChbCalendarInfo001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
