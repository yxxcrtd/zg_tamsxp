<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:id="|${entityName}_div|" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des" >中债资产要素信息——同业存单/债券/理财直融工具</span></h3>

        <div class="pro-module-item">
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussFinBondRepInfo.assetId}">代码</label>
                <div class="layui-input-inline input-inline">
                    <input th:id="|${entityName}_assetId|" th:name="|${entityName}.assetId|"
                           th:value="${entity?.assetId}"
                           class="layui-input form-input" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}" required>
                </div>
            </div>



            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" >名称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" th:id="|${entityName}_assetName|" disabled="true"
                           data-fixtype="2" class="layui-input form-input" required/>
                </div>
            </div>

            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap"
                       data-th-text="#{SvrBussFinBondRepInfo.repSectype}">具体类别</label>
                <div class="layui-input-inline input-inline">
                    <select id="repSectype" th:name="|${entityName}.repSectype|" parentIds="assetType2"
                            th:initValue="*{entity?.repSectype}"
                            class="layui-input form-input input-select"
                            allowClear="true" placeholder="请选择"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-result="${SVR_SEC_DETAIL_TYPE}"
                            formatoption=true></select>

                </div>
            </div>

        </div>
        <div class="layui-form-item">

            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussFinBondRepInfo.repIssueMode}">发行方式</label>
                <div class="layui-input-inline input-inline">
                    <select th:id="|${entityName}_repIssueMode|" th:name="|${entityName}.repIssueMode|"
                            th:initValue="${entity?.repIssueMode}"
                            class="layui-input form-input input-select" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_ISSUE_MODE_FUND}"
                            required>
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussFinBondRepInfo.secMainGrade}">主体评级</label>
                <div class="layui-input-inline input-inline">
                    <select th:id="|${entityName}_secMainGrade|" th:name="|${entityName}.secMainGrade|"
                            th:initValue="${entity?.secMainGrade}"
                            class="layui-input form-input input-select" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${CHB_BODY_GRADE}"
                            required>
                    </select>
                </div>
            </div>

            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussFinBondRepInfo.repPartyType1}">发行机构类型（按规模划分）</label>
                <div class="layui-input-inline input-inline">
                    <select th:id="|${entityName}_repPartyType1|" th:name="|${entityName}.repPartyType1|"
                            th:initValue="${entity?.repPartyType1}"
                            class="layui-input form-input input-select" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}" required
                            data-th-data-result="${SVR_PARTY_TYPE1}">
                    </select>
                </div>
            </div>

        </div>


        <div class="layui-form-item">

            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussFinBondRepInfo.repPartyType2}">发行机构类型（按经济类型划分）</label>
                <div class="layui-input-inline input-inline">
                    <select th:id="|${entityName}_repPartyType2|" th:name="|${entityName}.repPartyType2|"
                            th:initValue="${entity?.repPartyType2}"
                            class="layui-input form-input input-select" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}" required
                            data-th-data-result="${SVR_PARTY_TYPE2}">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussFinBondRepInfo.repPartyType3}">发行机构类型（按技术领域划分）</label>
                <div class="layui-input-inline input-inline">
                    <select th:id="|${entityName}_repPartyType3|" th:name="|${entityName}.repPartyType3|"
                            th:initValue="${entity?.repPartyType3}"
                            class="layui-input form-input input-select" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}" required
                            data-th-data-result="${SVR_PARTY_TYPE3}">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussFinBondRepInfo.repIndustry}">发行机构所属行业</label>
                <div class="layui-input-inline input-inline buss-inline-wrap"
                     style="width: 30%!important;display: inline-block;">
                    <select th:id="|${entityName}_repIndustry|"
                            th:name="|${entityName}.repIndustry|"
                            th:childrenIds="|${entityName}_repIndustryLevel2|"
                            th:initValue="${entity?.repIndustry}"
                            data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                            class="layui-input form-input input-select" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}" required>
                    </select>
                </div>
                <div class="layui-input-inline input-inline buss-inline-wrap"
                     style="width: 30%!important;display: inline-block;">
                    <select th:id="|${entityName}_repIndustryLevel2|"
                            th:name="|${entityName}.repIndustryLevel2|"
                            th:initValue="${entity?.repIndustryLevel2}"
                            data-th-parentids="|${entityName}_repIndustry|"
                            data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                            class="layui-input form-input input-select" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}">
                    </select>
                </div>

            </div>
        </div>

        <div class="layui-form-item" th:id="|${entityName}_project_other_div|">

            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussFinBondRepInfo.repRegistOrg}">登记托管机构</label>
                <div class="layui-input-inline input-inline">
                    <select th:id="|${entityName}_repRegistOrg|" th:name="|${entityName}.repRegistOrg|"
                            th:initValue="${entity?.repRegistOrg}"
                            class="layui-input form-input input-select" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}" required
                            data-th-data-result="${SVR_REGIST_ORG3}">
                    </select>
                </div>
            </div>

        </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap" style="width:100%;">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussFinBondRepInfo.repRegistorgComment}"
                           style=" width: 12.55%;">登记托管机构说明</label>
                    <div class="layui-input-inline input-inline" style="width:81%!important;">
                            <textarea th:id="|${entityName}_repRegistorgComment|" th:name="|${entityName}.repRegistorgComment|"
                                      th:value="${entity?.repRegistorgComment}" data-th-text="${entity?.repRegistorgComment}"
                                      class="layui-textarea"
                                      placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required="required"></textarea>
                    </div>
                </div>



            </div>

        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var entityName_BussFinBondRepInfo = /*[[${entityName}]]*/'';
    var AssetTypeInit = /*[[${AssetTypeInit}]]*/'';
    var issuerElement = /*[[${issuerElement}]]*/'';
    var PARTY_TYPE2_01 = /*[[${PARTY_TYPE2_01}]]*/'01';
    var PARTY_TYPE2_02 = /*[[${PARTY_TYPE2_02}]]*/'02';
    var PARTY_TYPE2_03 = /*[[${PARTY_TYPE2_03}]]*/'03';
    var PARTY_TYPE2_99 = /*[[${PARTY_TYPE2_99}]]*/'99';
    var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F18';
    var SVR_PARTY_TYPE1_01 = /*[[${SVR_PARTY_TYPE1_01}]]*/'01';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/bond/SvrBussFinBondRepInfo.js}"
        type="text/javascript"></script>
</body>

</html>
