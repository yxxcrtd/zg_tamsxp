<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:id="|${entityName}_div|"  class="pro-module-wrap">
        <div class="pro-module">
            <h3 class="pro-module-title"><span class="title-des" >中债资产要素信息——存款/大额存单</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
            <div class="pro-module-item">  
                <div class="layui-form-item">
                        <input th:id="|${entityName}_type6|" th:name="|${entityName}.type6|" hidden>

                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{SvrBussRepDepositInfo.bankName}">资金存入银行</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_bankName|" th:name="|${entityName}.bankName|"  data-th-value="${entity?.bankName}"
                                   class="layui-input form-input" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>

                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.repAccountNo}">存款账号</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_repAccountNo|" th:name="|${entityName}.repAccountNo|"   th:value="${entity?.repAccountNo}"  required
                                   class="layui-input form-input"/>
                        </div>
                    </div>

                    <div class=" form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{SvrBussRepDepositInfo.amt}">存款金额</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" data-fixtype="2" unit="1"
                                   class="layui-input form-input text-money" th:id="|${entityName}_amt|"
                                   th:name="|${entityName}.amt|" data-th-value="${entity?.amt}"
                                   data-moneymemory="" data-th-data-textrange="2"
                                   required="required">
                            <span class="input-right-show">元</span>
                        </div>
                    </div>

                </div>
                <div class="layui-form-item">


                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">起息日</label>
                        <div class="layui-input-inline input-inline">

                            <input type="text" disabled="true"
                                   th:id="|${entityName}_vdate|"
                                   class="layui-input form-input input-dateSelect" />
                        </div>
                    </div>


                    <div class="form-inline-wrap" >
                        <label class="layui-form-label form-label-wrap ">到期日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" disabled="true"
                                   th:id="|${entityName}_mdate|"
                                   class="layui-input form-input input-dateSelect" />
                        </div>
                    </div>


                    <div class="form-inline-wrap" th:id="|${entityName}_assetYield|">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.assetYield}">年利率%</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_assetYield|" th:name="|${entityName}.assetYield|"   th:value="${entity?.assetYield}"  required
                                   class="layui-input form-input text-number" data-textrange="5"/>
                        </div>
                    </div>

                </div>
                <div class="layui-form-item">

                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.basis}" >计息基础</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_basis|" th:name="|${entityName}.basis|" th:initValue="${entity?.basis}"
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_BASIS}">
                            </select>
                        </div>
                    </div>

                    <!-- 存款类型 中债新增字段 20200402 start-->
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.repDepoType}" >存款类型</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_repDepoType|" th:name="|${entityName}.repDepoType|" th:initValue="${entity?.repDepoType}"
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_DEPO_TYPE}">
                            </select>
                        </div>
                    </div>
                    <!-- 存款类型 中债新增字段 20200402 end-->
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepDepositInfo.repTargetType}" >结构性存款<br>挂钩标的类别</label>
                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_repTargetType|" th:name="|${entityName}.repTargetType|" th:initValue="${entity?.repTargetType}"  multiple="true"
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_TARGET_TYPE}">
                            </select>
                        </div>
                    </div>

                </div>

                <div class="layui-form-item">




                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{SvrBussRepDepositInfo.repTarget}">结构性存款<br>挂钩标的</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" th:id="|${entityName}_repTarget|" th:name="|${entityName}.repTarget|"  data-th-value="${entity?.repTarget}"
                                   class="layui-input form-input" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>



                </div>
            </div>
        </div>
    </div>
    <script data-th-inline="javascript" type="text/javascript">
        var type6_01 = /*[[${type6_01}]]*/'01';
        var type6_02 = /*[[${type6_02}]]*/'02';
        var type6Element = /*[[${type6Element}]]*/'type6';
        var SVR_DEPO_TYPE_06 = /*[[${SVR_DEPO_TYPE_06}]]*/'06';
        var SVR_ASSET_TYPE_SECOND_LEVEL_1002 = /*[[${SVR_ASSET_TYPE_SECOND_LEVEL_1002}]]*/'1002';
        var SVR_ASSET_TYPE_SECOND_LEVEL_1003 = /*[[${SVR_ASSET_TYPE_SECOND_LEVEL_1003}]]*/'1003';
        var entityName_BussRepDepositInfo = /*[[${entityName}]]*/'';
    </script>
    <script data-th-src="@{/js/report/chb/assetinfodetail/asset/depo/SvrBussRepDepositInfo.js}" type="text/javascript"></script>
</body>

</html>
