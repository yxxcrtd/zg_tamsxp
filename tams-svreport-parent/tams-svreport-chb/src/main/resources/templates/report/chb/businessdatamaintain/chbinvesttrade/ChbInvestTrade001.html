<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<meta charset="UTF-8">
<title data-th-text="#{ChbInvestTrade001}">投资交易信息</title>
</head>
<body>
	<div layout:fragment="content">
		<!-- 画面内容 -->
		<div class="form-button-area" >
			<a id="CchbInvestTrade001_btn_add" class="layui-btn layui-btn-sm btn-create"
			   data-th-text="#{SysCommon.create}">新建</a>
			<a id="CchbInvestTrade001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
			   data-th-text="#{SysCommon.delete}">删除</a>
			<a id="CchbInvestTrade001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">

				<div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable" data-th-text="#{ChbInvestTrade001.prodName}">产品名称</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="prodName"
									class="layui-input form-input input-select" formatoption = "false"
									data-th-data-url='@{/chb/businessdatamaintain/chbinvesttrade/chbinvesttrade001/getProdName}'
									allowClear="true" placeholder="请输入内容"  multiple="true" data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable" data-th-text="#{ChbInvestTrade001.regCode}">产品登记编码</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="regCode"
									class="layui-input form-input input-select" formatoption = "false"
									data-th-data-url='@{/svreport/system/proregistcodemanage/ProRegistCodeManage001/getRegCode}'
									allowClear="true" placeholder="请输入内容"  multiple="true" data-th-placeholder="#{SysCommon.placeholder}">
							</select>

						</div>
					</div>
					<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable" data-th-text="#{ChbInvestTrade001.tradeCode}">行内交易编码</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="tradeCode" name="tradeCode"
								   class="layui-input form-input" placeholder="请选择"
								   allowClear="true">
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable" data-th-text="#{ChbInvestTrade001.assetCode}">行内资产/负债编码</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="assetCode" class="input-select"
									data-th-data-url='@{/chb/businessdatamaintain/chbinvesttrade/chbinvesttrade001/getAssetCode}' formatoption = "false"
									allowClear="true" placeholder="请输入内容"  multiple="true" data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable" data-th-text="#{ChbInvestTrade001.tradeCounter}">交易对手</label>
						<div class="layui-input-inline input-inline">
							<select id="tradeCounter" class="input-select"
									data-th-data-url='@{/chb/businessdatamaintain/chbinvesttrade/chbinvesttrade001/getCustomerName}'
									initvalue="" placeholder="请选择"  formatoption = "false"
									data-th-placeholder="#{SysCommon.selectplaceholder}"
									allowClear="true" >
							</select>

						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable" data-th-text="#{ChbInvestTrade001.dealdate}">交易日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="dealdate"
								   class="layui-input form-input input-dateRangeSelect"  data-th-value = '${dealdate}'
								   placeholder="请选择、支持区间"  >
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable" data-th-text="#{ChbInvestTrade001.status}">数据状态</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="status"
								   class="layui-input form-input input-select" placeholder="请选择"
								   data-th-data-result="${MAINTAIN_STATUS}" allowClear="true">
						</div>
					</div>
				</div>
			</form>
		</div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
	</div>

	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var sysDate = [[${sysDate}]];
		</script>
		<script data-th-src="@{/js/report/chb/businessdatamaintain/chbinvesttrade/ChbInvestTrade001.js}"
				type="text/javascript"></script>
	</div>
</body>
</html>
