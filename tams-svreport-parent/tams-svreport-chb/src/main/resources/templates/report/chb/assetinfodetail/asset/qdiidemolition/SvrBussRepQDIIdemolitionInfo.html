<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
<style>
.buss-inline-wrap .select2-container{
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
</style>
</head>
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">中债资产要素信息——QDII拆出/逆回购</span></h3>
        <div class="pro-module-item">
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepQDIIdemolitionInfo.countryArea}">所属国家或地区</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_countryArea|" th:name="|${entityName}.countryArea|" data-th-data-result="${SVR_COUNTRY_AREA}" th:initValue="${entity?.countryArea}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap">起息日</label>
					<div class="layui-input-inline input-inline">

						<input type="text" disabled="true"
							   th:id="|${entityName}_vdate|"
							   class="layui-input form-input input-dateSelect" />
					</div>
				</div>
				<div class="form-inline-wrap" >
					<label class="layui-form-label form-label-wrap ">到期日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" disabled="true"
							   th:id="|${entityName}_mdate|"
							   class="layui-input form-input input-dateSelect" />
					</div>
				</div>




			</div>
			<div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepPlacementInfo.rivalParty}">对手方</label>
					<div class="layui-input-inline input-inline">
						<select type="text"
								th:id="|${entityName}_rivalParty|"
								th:name="|${entityName}.rivalParty|"
								th:initValue="${entity?.rivalParty}"
								class="layui-input form-input input-select"
								required="required"
								data-th-data-url="@{/common/select/getTrusterId}">
						</select>

					</div>
				</div>
				<div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
					<label class="layui-form-label form-label-wrap">年利率%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_assetYield|" th:name="|${entityName}.assetYield|"   th:value="${entity?.assetYield}"  required
							   class="layui-input form-input text-number" data-textrange="5"/>
						<!--
                                                <span class="input-right-show begin-show">%<a id="FinInterestFactor_btn_calRate" class="layui-btn layui-btn-sm form-input-text" >计算</a></span>
                        -->
					</div>
				</div>
				<div class="form-inline-wrap" th:id="|${entityName}_basis_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{BussRepQDIIdemolitionInfo.basis}" >计息基础</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_basis|" th:name="|${entityName}.basis|" th:initValue="${entity?.basis?:BASIS_INIT}"
								class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SVR_BASIS}">
						</select>
					</div>
				</div>
			</div>

        </div>
    </div>
</div>
<SCRIPT DATA-TH-INLINE="JAVASCRIPT" TYPE="TEXT/JAVASCRIPT">
	var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
	var entityName = /*[[${entityName}]]*/'';
	var FLAG_YES = /*[[${FLAG_YES}]]*/'';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/qdiidemolition/SvrBussRepQDIIdemolitionInfo.js}" type="text/javascript"></script>
</body>

</html>
