<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title data-th-text="#{LiquidityRiskInfo001}">流动性风险应对情况信息维护</title>
    <link rel="stylesheet" type="text/css"
          data-th-href="@{/css/report/report.css}">
    <style>
        .input-checkbox .layui-form-checkbox {
            margin-top: 0;
            height: 28px;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="form-button-area" filter="false">
        <a id="LiquidityRiskInfo001_btn_add" class="layui-btn layui-btn-sm btn-default">新建</a>
        <a id="LiquidityRiskInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default">删除</a>
        <a id="LiquidityRiskInfo001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
    </div>


    <div class="joyin-form-wrap condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">产品代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="prodId" name="prodId" data-th-data-url='@{/svreport/system/proregistcodemanage/ProRegistCodeManage001/getProdID}' data-th-data-formatoption=true data-th-data-parentids="orgCode" class="input-select" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">产品登记编码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="regCode" name="regCode" data-th-data-url='@{/svreport/system/proregistcodemanage/ProRegistCodeManage001/getRegCode}' data-th-data-formatoption=true data-th-data-parentids="orgCode" class="input-select" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">流动性风险应对措施</label>
                    <div class="layui-input-inline input-inline">
                        <select id="solutions" name="solutions" class="layui-input form-input input-select" data-th-data-result='${LIQUIDITY_RISK_TYPE}' placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">风险发生日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id="occurDate" type="text"  name="occurDate"  class="layui-input form-input timeControl input-dateRangeSelect" placeholder="请选择日期区间" />
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">风险应对日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id="replyDate" type="text"  name="replyDate"  class="layui-input form-input timeControl input-dateRangeSelect" placeholder="请选择日期区间" />
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">数据状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="status" name="status" class="layui-input form-input input-select" data-th-data-result='${MAINTAIN_STATUS}'  placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
                        </select>
                    </div>
                </div>
            </div>
            <div id="selectedColumns" class="layui-form-item"></div>
        </form>
    </div>
    <table class="layui-table" id="LiquidityRiskInfo001Table"></table>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/report/jquery.validate.js}"
            type="text/javascript"></script>
    <script data-th-src="@{/js/report/joyinvalid.js}"
            type="text/javascript"></script>
    <script data-th-src="@{/js/report/report-common.js}"
            type="text/javascript"></script>
    <script
            data-th-src="@{/js/report/chb/liquidityriskinfo/LiquidityRiskInfo001.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
