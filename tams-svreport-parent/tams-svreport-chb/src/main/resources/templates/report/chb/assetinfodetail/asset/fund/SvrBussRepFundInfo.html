<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
	<style>
		.buss-inline-wrap .select2-container {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			/*  width: auto!important; */
		}
	</style>
</head>
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
	<div class="pro-module">
		<h3 class="pro-module-title">
			<span class="title-des">公募基金/私募基金</span>（<span class="star-sign">*</span>必填）<i
				class="iconfont icon-arrow-down pro-down-icon"></i>
		</h3>
		<input type="text" th:id="|${entityName}_profitType|"
			   th:name="|${entityName}.profitType|" hidden>
		<div class="pro-module-item">




			<div class="layui-form-item" th:id="|${entityName}_content_one_div|">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{SvrBussRepFundInfo.assetId}">基金代码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_assetId|" th:name="|${entityName}.assetId|"
							   data-th-value="${entity?.assetId}" disabled="disabled"
							   class="layui-input form-input" placeholder="请输入内容"
							   data-th-placeholder="#{SysCommon.placeholder}" required>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						   data-th-utext="#{SvrBussRepFundInfo.assetName}">基金名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_assetName|"
							   th:value="${entity?.assetName}"  disabled="disabled"
							   data-fixtype="2" class="layui-input form-input" required/>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{SvrBussRepFundInfo.financialComissue}">是否由金融资产投资公司发行</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_financialComissue|" th:name="|${entityName}.financialComissue|"
								th:initValue="${entity?.financialComissue}" class="layui-input form-input input-select"
								placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${SVR_YES_OR_NO}">
						</select>
					</div>
				</div>

			</div>

			<div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-utext="#{SvrBussRepFundInfo.industryShares}">行业一级分类</label>
					<div class="layui-input-inline input-inline">
						<select id="fundndustryShares" th:name="|${entityName}.industryShares|"
								data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
								th:initValue="${entity?.industryShares}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								childrenIds="fundindustryShares2"
								data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-utext="#{SvrBussRepFundInfo.industryShares2}">行业二级分类</label>
					<div class="layui-input-inline input-inline">
						<select id="fundindustryShares2" th:name="|${entityName}.industryShares2|"
								data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
								th:initValue="${entity?.industryShares2}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								parentIds="fundndustryShares"
								data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						   data-th-utext="#{SvrBussRepFundInfo.registOrg1}">登记备案机构</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_registOrg1|"
								th:name="|${entityName}.registOrg1|"
								data-th-data-result="${SVR_REGIST_ORG2}"
								th:initValue="${entity?.registOrg1}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								required>
						</select>
					</div>
				</div>
			</div>


			<div class="layui-form-item">


				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						   data-th-utext="#{SvrBussRepFundInfo.isGovernFund}"
						   style="line-height: normal !important;">是否属于政府投资基金
					</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_isGovernFund|" th:name="|${entityName}.isGovernFund|"
								th:initValue="${entity?.isGovernFund}" class="layui-input form-input input-select"
								placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${SVR_YES_OR_NO}">
						</select>
					</div>
				</div>


				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						   data-th-utext="#{SvrBussRepFundInfo.governInvestFund}"
						   style="line-height: normal !important;">政府投资基金投向
					</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_governInvestFund|"
								th:name="|${entityName}.governInvestFund|"
								th:initValue="${entity?.governInvestFund}"
								data-th-data-result="${SVR_GOV_INVEST_DIRECT}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						   data-th-utext="#{SvrBussRepFundInfo.fundEnpeName}">基金公司名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_fundEnpeName|"
							   th:name="|${entityName}.fundEnpeName|"
							   th:value="${entity?.fundEnpeName}"
							   data-fixtype="2" class="layui-input form-input"/>
					</div>
				</div>


			</div>


			<div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						   data-th-utext="#{SvrBussRepFundInfo.mngOrgName}">基金管理机构名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_mngOrgName|"
							   th:name="|${entityName}.mngOrgName|" required
							   th:value="${entity?.mngOrgName}"
							   data-fixtype="2" class="layui-input form-input"/>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						   data-th-utext="#{SvrBussRepFundInfo.truOrgName}">基金托管机构名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_truOrgName|"
							   th:name="|${entityName}.truOrgName|" required
							   th:value="${entity?.truOrgName}"
							   data-fixtype="2" class="layui-input form-input"/>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						   data-th-utext="#{SvrBussRepFundInfo.investStage}">投资阶段</label>
					<div class="layui-input-inline input-inline">
						<select type="text" th:id="|${entityName}_investStage|"
								th:name="|${entityName}.investStage|"
								th:initValue="${entity?.investStage}"
								data-th-data-result="${SVR_INVEST_STAGE}"
								class="layui-input form-input input-select">
						</select>
					</div>
				</div>
			</div>

			<div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{SvrBussRepFundInfo.sharesType1}">投资企业类型（按规模划分）</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_sharesType1|" th:name="|${entityName}.sharesType1|"
								th:initValue="${entity?.sharesType1}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${SVR_PARTY_TYPE1}">
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{SvrBussRepFundInfo.sharesType3}">投资企业类型（按技术领域划分）</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_sharesType3|" th:name="|${entityName}.sharesType3|"
								th:initValue="${entity?.sharesType3}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${SVR_PARTY_TYPE3}">
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{SvrBussRepFundInfo.sharesType2}">投资企业类型（按经济类型划分）</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_sharesType2|" th:name="|${entityName}.sharesType2|"
								th:initValue="${entity?.sharesType2}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${SVR_PARTY_TYPE2}">
						</select>
					</div>
				</div>
			</div>

			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						   data-th-utext="#{SvrBussRepFundInfo.chbManagerId}">管理人</label>
					<div class="layui-input-inline input-inline">
						<!--						<input type="text" th:id="|${entityName}_chbManagerId|"-->
						<!--							   th:name="|${entityName}.chbManagerId|"-->
						<!--							   th:value="${entity?.chbManagerId}"-->
						<!--							   data-fixtype="2" class="layui-input form-input"/>-->
						<select th:id="|${entityName}_chbManagerId|"
								th:name="|${entityName}.chbManagerId|"
								th:value="${entity?.chbManagerId}" required
								class="layui-input form-input input-select"
								data-th-data-url="@{/common/select/getManagerId}">
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						   data-th-utext="#{SvrBussRepFundInfo.isUnlisted}">是否政府出资产业投资基金</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_isUnlisted|"
								th:name="|${entityName}.isUnlisted|"
								th:initValue="${entity?.isUnlisted}"
								data-th-data-result="${SVR_YES_OR_NO}" required
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>
			</div>



			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						   data-th-utext="#{SvrBussRepFundInfo.fundInvestAsset}">基金投资资产</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_fundInvestAsset|"
							   th:name="|${entityName}.fundInvestAsset|" required
							   th:value="${entity?.fundInvestAsset}"
							   data-fixtype="2" class="layui-input form-input"/>
					</div>
				</div>


				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepFundInfo.privatefundFlag}">投向金融资产投资公司或其附属机构发行的私募股权投资基金</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_privatefundFlag|" th:name="|${entityName}.privatefundFlag|"
								th:initValue="${entity?.privatefundFlag}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_YES_OR_NO}" required>
						</select>
					</div>
				</div>
				<!-- 中债新增字段 add by tuqirong 2021-12-30 start -->
				<div class="form-inline-wrap" th:id="|${entityName}_profitFlag_div|" style="disabled:none;">
					<label class="layui-form-label form-lable" data-th-utext="#{SvrBussRepFundInfo.profitFlag}">是否为固定收益类</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_profitFlag|" th:name="|${entityName}.profitFlag|"
								th:initValue="${entity?.profitFlag}" class="layui-input form-input input-select"
								placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
								data-th-data-result="${SVR_YES_OR_NO}">
						</select>
					</div>
				</div>
				<!-- 中债新增字段 add by tuqirong 2021-12-30 end -->

			</div>
			<div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repPppflag}">公共PPP</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_pppflag|" th:name="|${entityName}.pppflag|"
								th:initValue="${entity?.pppflag}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_YES_OR_NO}" required>
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repBondtostockFlag}">是否投向市场化债转股相关产品的部分</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_bondtostockFlag|" th:name="|${entityName}.bondtostockFlag|"
								th:initValue="${entity?.bondtostockFlag}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_YES_OR_NO}" required>
						</select>
					</div>
				</div>

			</div>
			<!--add by yjp 估值穿透开发--监管报送资产基本信息维护导入功能合并华夏字段 start -->
			<div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType1}" >新人行一级分类</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_pbcAssetType1|" th:name="|${entityName}.pbcAssetType1|" th:initValue="${entity?.pbcAssetType1}"
								th:childrenIds="|${entityName}_pbcAssetType2|" required
								class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_1}">
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType2}" >新人行二级分类</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_pbcAssetType2|" th:name="|${entityName}.pbcAssetType2|" th:initValue="${entity?.pbcAssetType2}"
								th:childrenIds="|${entityName}_pbcAssetType3|" th:parentIds="|${entityName}_pbcAssetType1|" required
								class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_2}">
						</select>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType3}" >新人行三级分类</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_pbcAssetType3|" th:name="|${entityName}.pbcAssetType3|" th:initValue="${entity?.pbcAssetType3}"
								th:parentIds="|${entityName}_pbcAssetType2|" required
								class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_3}">
						</select>
					</div>
				</div>

			</div>
			<!--add by yjp 估值穿透开发--监管报送资产基本信息维护导入功能合并华夏字段 end -->

			<div class="layui-form-item">
				<div class="layui-form-item">
					<div class="form-inline-wrap" style="width:100%;">
						<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepFundInfo.remark}"
							   style=" width: 12.55%;">备注</label>
						<div class="layui-input-inline input-inline" style="width:81%!important;">
							<input th:id="|${entityName}_remark|" th:name="|${entityName}.remark|"
								   th:value="${entity?.remark}" class="layui-input form-input" placeholder="请输入内容"
								   data-th-placeholder="#{SysCommon.placeholder}"></input>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var h_01 = /*[[${h_01}]]*/'01';//货币基金
		var Y = /*[[${Y}]]*/'Y';//是
		var SVR_YES_OR_NO_default = /*[[${SVR_YES_OR_NO_default}]]*/'01';
		var z_02 = /*[[${z_02}]]*/'02';//货币市场基金
		var fundTypeElement = /*[[${fundTypeElement}]]*/'fundType';
		var secondTypeElement = /*[[${secondTypeElement}]]*/'secondType';
		var BussRepFundInfoentityName = [[${entityName}]];
		var repIsGovInvest = /*[[${entity?.repIsGovInvest}]]*/'';
		var CHB_FUND_ASSET_SECOND_TYPE_01 = /*[[${CHB_FUND_ASSET_SECOND_TYPE_01}]]*/'1106';
		var CHB_FUND_ASSET_SECOND_TYPE_02 = /*[[${CHB_FUND_ASSET_SECOND_TYPE_02}]]*/'2401';
		var CHB_FUND_ASSET_SECOND_TYPE_03 = /*[[${CHB_FUND_ASSET_SECOND_TYPE_03}]]*/'1303';
		var CHB_FUND_ASSET_SECOND_TYPE_04 = /*[[${CHB_FUND_ASSET_SECOND_TYPE_04}]]*/'2402';
		//中债保本基金字段删除
		// var CHB_FUND_ASSET_SECOND_TYPE_05 = /*[[${CHB_FUND_ASSET_SECOND_TYPE_05}]]*/'06';
		//中债保本基金字段删除
		var CHB_FUND_ASSET_SECOND_TYPE_06 = /*[[${CHB_FUND_ASSET_SECOND_TYPE_06}]]*/'2499';
		var CHB_FUND_ASSET_SECOND_TYPE_07 = /*[[${CHB_FUND_ASSET_SECOND_TYPE_07}]]*/'2403';
		var FUND_ASSET_SECOND_TYPE_01 = /*[[${FUND_ASSET_SECOND_TYPE_01}]]*/'01';
		var FUND_ASSET_SECOND_TYPE_02 = /*[[${FUND_ASSET_SECOND_TYPE_02}]]*/'02';
		var FUND_ASSET_SECOND_TYPE_03 = /*[[${FUND_ASSET_SECOND_TYPE_03}]]*/'03';
		var FUND_ASSET_SECOND_TYPE_04 = /*[[${FUND_ASSET_SECOND_TYPE_04}]]*/'04';
		var FUND_ASSET_SECOND_TYPE_05 = /*[[${FUND_ASSET_SECOND_TYPE_05}]]*/'05';
		var FUND_ASSET_SECOND_TYPE_06 = /*[[${FUND_ASSET_SECOND_TYPE_06}]]*/'06';
		var FUND_ASSET_SECOND_TYPE_07 = /*[[${FUND_ASSET_SECOND_TYPE_07}]]*/'07';
		var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'99';
		var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F18';
		var INT_ASSET_TYPE = /*[[${INT_ASSET_TYPE}]]*/'F18';
		var SVR_PARTY_TYPE1_01 = /*[[${SVR_PARTY_TYPE1_01}]]*/'01';
	</script>
	<script data-th-src="@{/js/report/chb/assetinfodetail/asset/fund/SvrBussRepFundInfo.js}"
			type="text/javascript"></script>
</div>
</body>

</html>
