<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title>汇率行情信息</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">货币对</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="exchargeCode" name="exchargeCode"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${CYY_PAIR}' allowClear="true" placeholder="请输入内容"
                                    data-th-initValue="${entity?.exchargeCode}" required="required"
                                    data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                                <option></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">生效日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="tradeDate" name="tradeDate"
                                   class="layui-input form-input input-dateSelect"
                                   data-th-data-result='${COMMON_BUSINESS_TYPE}' placeholder="请输入内容"
                                   data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}"
                                   required="required" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">数据来源</label>
                        <div class="layui-input-inline input-inline">
                            <input id="datasourceType" name="datasourceType"
                                   class="layui-input form-input input-select"
                                   data-th-data-result='${VALUATION_SOURCE}' placeholder="请输入内容"
                                   data-th-value="${entity?.datasourceType}"
                                   required="required" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">开盘价</label>
                        <div class="layui-input-inline input-inline">
                            <input id="openPrice" name="openPrice" type="text"
                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                   maxlength="9" data-th-value="${entity?.openPrice}" required="required"
                                   data-fixtype="2" data-textrange='5' data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">收盘价</label>
                        <div class="layui-input-inline input-inline">
                            <input id="closePrice" name="closePrice" type="text"
                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                   maxlength="9" data-th-value="${entity?.closePrice}" required="required"
                                   data-fixtype="2" data-textrange='5' data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">最高价</label>
                        <div class="layui-input-inline input-inline">
                            <input id="highPrice" name="highPrice" type="text"
                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                   data-th-value="${entity?.highPrice}" required="required" maxlength="9"
                                   data-fixtype="2" data-textrange='5' data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">最低价</label>
                        <div class="layui-input-inline input-inline">
                            <input id="lowPrice" name="lowPrice" maxlength="9" type="text"
                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                   data-th-value="${entity?.lowPrice}" required="required" data-fixtype="2" data-textrange='5'
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">中间价</label>
                        <div class="layui-input-inline input-inline">
                            <input id="midPrice" name="midPrice" maxlength="9" type="text"
                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                   data-th-value="${entity?.midPrice}" required="required" data-fixtype="2" data-textrange='5'
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable">报价单位</label>
                        <div class="layui-input-inline input-inline">
                            <input id="quotUnit" name="quotUnit" maxlength="15" type="text"
                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                   data-th-value="${entity?.quotUnit}" required="required" data-fixtype="2" data-textrange='0'
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                        <input type="hidden"  id="statusValid" name="statusValid" class="layui-input form-input" data-th-value="${entity?.statusValid}">
                        <input type="hidden"  id="datauuid" name="datauuid" class="layui-input form-input" data-th-value="${entity?.datauuid}">
                        <input id="submitType" name="submitType" type="text"/>
                    </div>
                </div>
            </form>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 40px 0 30px 0;">
                <div class="text-center">
                    <a id="ChbExchangeQuotationInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
                    <a id="ChbExchangeQuotationInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/report/chb/businessdatamaintain/chbexchangeinfo/ChbExchangeQuotationInfo002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
