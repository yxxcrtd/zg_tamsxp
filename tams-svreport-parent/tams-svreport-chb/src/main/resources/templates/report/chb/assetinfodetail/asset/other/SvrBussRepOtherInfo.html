<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .buss-inline-wrap .select2-container {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">中债资产要素信息——其他（负债）类资产</span></h3>
        <div class="pro-module-item">
            <div class="layui-form-item">


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepOtherInfo.countryArea}">所属国家或地区</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_countryArea|" th:name="|${entityName}.countryArea|"
                                data-th-data-result="${SVR_COUNTRY_AREA}" th:initValue="${entity?.countryArea}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable" >名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetName|" disabled="true"
                               class="layui-input form-input"required>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepOtherInfo.termDate}">期限(天)</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_termDate|" th:name="|${entityName}.termDate|"
                               th:value="${entity?.termDate}" data-textrange="0" maxlength="6"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>








            </div>


            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepOtherInfo.debtScale}">负债规模</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_debtScale|" th:name="|${entityName}.debtScale|"
                               required="required"
                               th:value="${entity?.debtScale}" data-textrange="2"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>


                <div class="form-inline-wrap" th:id="|${entityName}_investRate_div|">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInfo.assetYield}">利率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetYield|" th:name="|${entityName}.assetYield|"
                               th:value="${entity?.assetYield}"
                               class="layui-input form-input text-number" data-textrange="5"/>
                        <span class="input-right-show">%</span>
                    </div>
                </div>
                <!-- 中债新增字段 add by tuqirong 2021-12-30 start -->
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepOtherInfo.isDepositFlag}">是否为同业借款</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_isDepositFlag|" th:name="|${entityName}.isDepositFlag|"
                                th:initValue="${entity?.isDepositFlag}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>
                <!-- 中债新增字段 add by tuqirong 2021-12-30 end -->
            </div>

            </div>
        </div>
    </div>
    <script data-th-inline="javascript" type="text/javascript">
        var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
        var entityName = /*[[${entityName}]]*/'';
        var FLAG_YES = /*[[${FLAG_YES}]]*/'';
    </script>
    <script data-th-src="@{/js/report/chb/assetinfodetail/asset/other/SvrBussRepOtherInfo.js}"
            type="text/javascript"></script>
</body>

</html>
