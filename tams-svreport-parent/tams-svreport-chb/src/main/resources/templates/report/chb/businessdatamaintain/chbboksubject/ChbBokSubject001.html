<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ChbBokSubject}">科目定义信息</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" >
             <a id="ChbBokSubject001_btn_add" class="layui-btn layui-btn-sm btn-create"
                 data-th-text="#{SysCommon.create}">新建</a>
            <a id="ChbBokSubject001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                data-th-text="#{SysCommon.delete}">删除</a>
            <a id="ChbBokSubject001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2"data-th-text="#{ChbBokSubject.subjectNo}">科目号</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="subjectNo" name="subjectNo"
                                    class="layui-input form-input input-select"
                                    parentIds = "subjectLevel" formatoption = "false"
                                    data-th-data-url='@{/chb/businessdatamaintain/chbboksubject/chbboksubject001/getSubjectId2}'
                                    allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2" data-th-text="#{ChbBokSubject.subjectName}">科目名称</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="subjectName" name="subjectName"
                                    class="layui-input form-input input-select"
                                    parentIds = "subjectLevel" formatoption = "false"
                                    data-th-data-url='@{/chb/businessdatamaintain/chbboksubject/chbboksubject001/getSubjectName}'
                                    allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2" data-th-text="#{ChbBokSubject.fsubjectId}">上级科目号</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="fsubjectId" name="fsubjectId"
                                   class="layui-input form-input input-lenovoselect " placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-url="@{/chb/businessdatamaintain/chbboksubject/chbboksubject001/getFSubjectId}"
                                   data-idfield="code" data-keyfield="code"
                                   data-th-data-effectivefieldsalias='|{"code":"#{ChbBokSubject.fsubjectId}","shortName":"#{ChbBokSubject.subjectName}"}|'>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2" data-th-text="#{ChbBokSubject.subjectType}">科目类型</label>
                        <div class="layui-input-inline input-inline">
                            <input id="subjectType" name="subjectType" class="input-select"
                                   data-th-data-result="${SUBJECT_TYPE}" placeholder="请选择" allowClear="true">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2" data-th-text="#{ChbBokSubject.subjectLevel}">科目级别</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="subjectLevel" name="subjectLevel"
                                    class="layui-input form-input input-select"
                                    parentIds = "subjectNo"
                                    data-th-data-url='@{/chb/businessdatamaintain/chbboksubject/chbboksubject001/getSubjectLevel}'

                                    allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2" data-th-text="#{ChbBokSubject.balFlag}">科目方向</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="balFlag" name="balFlag" placeholder="请选择"
                                class="layui-input form-input input-select" data-th-data-result='${BAL_FLAG}'>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2" data-th-text="#{ChbBokSubject.status}">数据状态</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="status" name="status" placeholder="请选择"
                                   class="layui-input form-input input-select" data-th-data-result='${MAINTAIN_STATUS}'>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/report/chb/businessdatamaintain/chbboksubject/ChbBokSubject001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
