<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
<style>
.buss-inline-wrap .select2-container{
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
</style>
</head>
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">中债资产要素信息——贵金属/商品</span></h3>
        <div class="pro-module-item">
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepNobleMetalInfo.countryArea}">所属国家或地区</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_countryArea|" th:name="|${entityName}.countryArea|" data-th-data-result="${SVR_COUNTRY_AREA}" th:initValue="${entity?.countryArea}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable">名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_assetName|"disabled="true"
							   data-fixtype="2" class="layui-input form-input" required/>
					</div>
				</div>
				<div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepNobleMetalInfo.termDate}">期限（天）</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_termDate|" th:name="|${entityName}.termDate|"   th:value="${entity?.termDate}"
							   class="layui-input form-input text-number" data-textrange="0"/>
					</div>
				</div>
			</div>

			<div class="layui-form-item">

				<div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepNobleMetalInfo.assetValue}">资产价值</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_assetValue|" th:name="|${entityName}.assetValue|"   th:value="${entity?.assetValue}"  required
							   class="layui-input form-input text-number" data-textrange="2"/>
					</div>
				</div>
				<div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepNobleMetalInfo.assetYield}">资产收益率%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_assetYield|" th:name="|${entityName}.assetYield|"   th:value="${entity?.assetYield}"
							   class="layui-input form-input text-number" data-textrange="5"/>
					</div>
				</div>
			</div>

        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
    var entityName = /*[[${entityName}]]*/'';
    var FLAG_YES = /*[[${FLAG_YES}]]*/'';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/noblemetal/SvrBussRepNobleMetalInfo.js}" type="text/javascript"></script>
</body>
</html>
