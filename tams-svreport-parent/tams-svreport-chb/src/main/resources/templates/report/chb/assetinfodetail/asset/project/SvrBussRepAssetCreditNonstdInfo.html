<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:id="|${entityName}_div|" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">中债资产要素信息——非标准化债权资产（包括信托贷款、委托贷款、信贷资产转让、委托债权、应收账款、收/受益权、带回购条款的股权性融资、 债权融资类产品、同业借款、收益凭证、债权投资计划和资产支持计划、信贷资产流转和收益权转让产品等）</span></h3>
        <div class="pro-module-item">
            <div class="layui-form-item" th:id="|${entityName}_content_one_div|">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repProfitType}">收/受益权类型</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repProfitType|" th:name="|${entityName}.repProfitType|"
                                th:initValue="${entity?.repProfitType}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_PROFIT_TYPE}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repIsResale}">是否属于买入返售</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repIsResale|" th:name="|${entityName}.repIsResale|"
                                th:initValue="${entity?.repIsResale}"
                                class="layui-input form-input input-select" placeholder="请输入内容" required="required"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" >名称</label>
                    <div class="layui-input-inline input-inline">
                        <input th:id="|${entityName}_assetName|" disabled="true"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" >
                    </div>
                </div>




            </div>
            <div class="layui-form-item">


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" >资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <input th:id="|${entityName}_repCreditAssetCode|" th:name="|${entityName}.repCreditAssetCode|"
                               th:value="${entity?.repCreditAssetCode}" disabled="true"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>

                <div class=" form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.amt}">金额</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" data-fixtype="2" unit="1"
                               class="layui-input form-input text-money"
                               th:id="|${entityName}_amt|" th:name="|${entityName}.amt|"
                               data-th-value="${entity?.amt}"
                               data-moneymemory="" data-th-data-textrange="2"
                               required="required">
                        <span class="input-right-show">元</span>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repPrinBaseamt}">份额面值</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repPrinBaseamt|"
                               th:name="|${entityName}.repPrinBaseamt|" data-th-value="${entity?.repPrinBaseamt}"
                               class="layui-input form-input text-number" placeholder="请输入内容" data-textrange="4"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>


            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">起息日</label>
                    <div class="layui-input-inline input-inline">

                        <input type="text" disabled="true"
                               th:id="|${entityName}_vdate|"
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>


                <div class="form-inline-wrap" >
                    <label class="layui-form-label form-label-wrap ">到期日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" disabled="true"
                               th:id="|${entityName}_mdate|"
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repFmdate}">法定到期日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repFmdate|" th:name="|${entityName}.repFmdate|"
                               data-th-value='${#dates.format(entity?.repFmdate,"yyyy-MM-dd")}'
                               class="layui-input form-input input-dateSelect"/>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repRateFlag}">是否有预期收益率</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repRateFlag|" th:name="|${entityName}.repRateFlag|"
                                th:initValue="${entity?.repRateFlag}" required="required"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.assetYield}">项目收益率(利率)%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetYield|" th:name="|${entityName}.assetYield|"
                               th:value="${entity?.assetYield}"
                               class="layui-input form-input text-number" data-textrange="5"/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repCouponSpecies}">计息类型</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repCouponSpecies|" th:name="|${entityName}.repCouponSpecies|"
                                th:initValue="${entity?.repCouponSpecies}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_COUPON_SPECIES}">
                        </select>
                    </div>
                </div>



            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.interestRuleFlag}">规则付息标识</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_interestRuleFlag|" th:name="|${entityName}.interestRuleFlag|"
                                th:initValue="${entity?.interestRuleFlag}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repIntpayCycle}">付息频率（个月/次）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repIntpayCycle|"
                               th:name="|${entityName}.repIntpayCycle|" data-th-value="${entity?.repIntpayCycle}"
                               class="layui-input form-input text-number" placeholder="请输入内容" data-textrange="0"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repIntpayRule}">利息分布方式</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repIntpayRule|" th:name="|${entityName}.repIntpayRule|"
                                th:initValue="${entity?.repIntpayRule}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_INTPAY_RULE}">
                        </select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width:100%;">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repRepayCmt}"
                           style=" width: 11.9%;">还本付息情况说明</label>
                    <div class="layui-input-inline input-inline" style="width:81%!important;">
                            <textarea th:id="|${entityName}_repRepayCmt|" th:name="|${entityName}.repRepayCmt|"
                                      th:value="${entity?.repRepayCmt}" data-th-text="${entity?.repRepayCmt}"
                                      class="layui-textarea"
                                      placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required="required"></textarea>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">



                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.basis}">计息基础</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_basis|" th:name="|${entityName}.basis|"
                                th:initValue="${entity?.basis}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_BASIS}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.basisType}">基准利率种类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_basis|" th:name="|${entityName}.basisType|"
                                th:initValue="${entity?.basisType}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_BASIS_TYPE}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.floatFactorFlag}">是否有浮动因子</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_floatFactorFlag|" th:name="|${entityName}.floatFactorFlag|"
                                th:initValue="${entity?.floatFactorFlag}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>


            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.floatFactor}">浮动因子%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_floatFactor|" th:name="|${entityName}.floatFactor|"
                               th:value="${entity?.floatFactor}"
                               class="layui-input form-input text-number" data-textrange="5"/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.spreadRate}">利差(BP)</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_spreadRate|" th:name="|${entityName}.spreadRate|"
                               th:value="${entity?.spreadRate}"
                               class="layui-input form-input text-number" data-textrange="5"/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repStructGrade}">结构档次</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repStructGrade|" th:name="|${entityName}.repStructGrade|"
                                th:initValue="${entity?.repStructGrade}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_STRUCT_GRADE}">
                        </select>
                    </div>
                </div>

            </div>
            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repRepaymentType}">还本方式</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repRepaymentType|" th:name="|${entityName}.repRepaymentType|"
                                th:initValue="${entity?.repRepaymentType}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_REPAYMENT_TYPE}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repPeriodRepaymentFlag}">分期还本条款标识</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repPeriodRepaymentFlag|"
                                th:name="|${entityName}.repPeriodRepaymentFlag|"
                                th:initValue="${entity?.repPeriodRepaymentFlag}"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_PERIOD_REPAYMENT_FLAG}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">

                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repBasicAssetType}">基础资产类型</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repBasicAssetType|"
                               th:name="|${entityName}.repBasicAssetType|" data-th-value="${entity?.repBasicAssetType}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>

            </div>


            <div class="layui-form-item">


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repExcessProfitRate}">超额收益分配比例%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repExcessProfitRate|"
                               th:name="|${entityName}.repExcessProfitRate|"
                               data-th-value="${entity?.repExcessProfitRate}"
                               class="layui-input form-input text-number" placeholder="请输入内容" data-textrange="5"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">融资人</label>
                    <div class="layui-input-inline input-inline">

                        <div class="layui-input-inline input-inline">
                            <select th:id="|${entityName}_repFinancie|"
                                    th:name="|${entityName}.repFinancie|"
                                    th:initValue="${entity?.repFinancie}"
                                    class="layui-input form-input input-select"
                                    required="required"
                                    data-th-data-url="@{/common/select/getTrusterId}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repFcrGradeIn}">融资人内部信用评级</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repFcrGradeIn|" th:name="|${entityName}.repFcrGradeIn|"
                               data-th-value="${entity?.repFcrGradeIn}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repFcrGradeOut}">外部评级机构名称及对融资人评级结果</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repFcrGradeOut|"
                               th:name="|${entityName}.repFcrGradeOut|" data-th-value="${entity?.repFcrGradeOut}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repFinancierType1}">融资人类型（按规模划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repFinancierType1|" th:name="|${entityName}.repFinancierType1|"
                                th:initValue="${entity?.repFinancierType1}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE1}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repFinancierType3}">融资人类型（按技术领域划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repFinancierType2|" th:name="|${entityName}.repFinancierType2|"
                                th:initValue="${entity?.repFinancierType2}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE3}">
                        </select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repFinancierType2}">融资人类型（按经济类型划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repFinancierType3|" th:name="|${entityName}.repFinancierType3|"
                                th:initValue="${entity?.repFinancierType3}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE2}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repFinanceProj}">融资项目</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_repFinanceProj|"
                               th:name="|${entityName}.repFinanceProj|" data-th-value="${entity?.repFinanceProj}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repIndustry1}">融资人所属行业</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <input th:id="|${entityName}_repIndustry1|"
                               th:name="|${entityName}.repIndustry1|"
                               th:childrenIds="|${entityName}_industryLevel2Type|"
                               th:initValue="${entity?.repIndustry1}"
                               data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                               class="layui-input form-input input-select" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <input th:id="|${entityName}_industryLevel2Type|"
                               th:name="|${entityName}.industryLevel2Type|"
                               th:initValue="${entity?.industryLevel2Type}"
                               data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                               class="layui-input form-input input-select" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" >
                    </div>
                </div>





            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repIndustryFlag}">项目是否属于重点监控行业和领域</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_repIndustryFlag|" th:name="|${entityName}.repIndustryFlag|"
                                th:initValue="${entity?.repIndustryFlag}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repMonitType}">重点监控行业和领域类别</label>
                    <div class="layui-input-inline input-inline">
