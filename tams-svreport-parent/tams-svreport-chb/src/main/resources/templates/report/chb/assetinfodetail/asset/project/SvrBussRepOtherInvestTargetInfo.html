<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:id="|${entityName}_div|" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">中债资产要素信息——其他非标准化债权类/权益类/代客境外理财投资QDII/新增可投资资产</span></h3>
        <div class="pro-module-item">


            <div class="layui-form-item" th:id="|${entityName}_content_one_div|">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetName|"disabled="true"
                               data-fixtype="2" class="layui-input form-input" required/>
                    </div>
                </div>


                <div class="form-inline-wrap" th:id="|${entityName}_repBankAssetType_div|">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.inAssetType}">行内资产类别</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_inAssetType|" th:name="|${entityName}.inAssetType|"
                                th:initValue="${entity?.inAssetType}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_BANK_IN_ASSET_TYPE}">
                        </select>
                    </div>
                </div>


                <div class="form-inline-wrap" th:id="|${entityName}_repBankAssetTyprExplain_div|">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.inAssetTypeCmm}">行内资产类别说明</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_inAssetTypeCmm|"
                               th:name="|${entityName}.inAssetTypeCmm|"
                               data-th-value="${entity?.inAssetTypeCmm}" class="layui-input form-input"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
                    </div>
                </div>


            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.amt}">金额</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_amt|"
                               th:name="|${entityName}.amt|"

                               th:value="${entity?.amt}" data-textrange="2"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">起息日</label>
                    <div class="layui-input-inline input-inline">

                        <input type="text" disabled="true"
                               th:id="|${entityName}_vdate|"
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>


                <div class="form-inline-wrap" >
                    <label class="layui-form-label form-label-wrap ">到期日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" disabled="true"
                               th:id="|${entityName}_mdate|"
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>

            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.countryArea}">所属国家或地区</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_countryArea|" th:name="|${entityName}.countryArea|"
                                th:initValue="${entity?.countryArea}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_COUNTRY_AREA}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.rateFlag}">是否有预期收益率</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_rateFlag|" th:name="|${entityName}.rateFlag|"
                                th:initValue="${entity?.rateFlag}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap" th:id="|${entityName}_investRate_div|">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.assetYield}">项目收益率（利率）%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetYield|" th:name="|${entityName}.assetYield|"
                               th:value="${entity?.assetYield}"
                               class="layui-input form-input text-number" data-textrange="5"/>
                        <span class="input-right-show">%</span>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.intpayCycle}">付息频率（个月/次）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_intpayCycle|"
                               th:name="|${entityName}.intpayCycle|"
                               th:value="${entity?.intpayCycle}" data-textrange="0" required="required"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.financie}">融资人</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_financie|"
                                th:name="|${entityName}.financie|"
                                th:initValue="${entity?.financie}"
                                class="layui-input form-input input-select"
                                required="required"
                                data-th-data-url="@{/common/select/getTrusterId}">
                        </select>
                    </div>


                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.finOrgCode}">融资人组织机构（社会信用）代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_finOrgCode|"
                               th:name="|${entityName}.finOrgCode|"
                               data-th-value="${entity?.finOrgCode}" class="layui-input form-input"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.fcrGradeOut}">外部评级机构名称及对融资人评级结果</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_fcrGradeOut|"
                               th:name="|${entityName}.fcrGradeOut|"
                               data-th-value="${entity?.fcrGradeOut}" class="layui-input form-input"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.financierType1}">融资人类型（按规模划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_financierType1|" th:name="|${entityName}.financierType1|"
                                th:initValue="${entity?.financierType1}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE1}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.financierType2}">融资人类型（按技术领域划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_financierType2|" th:name="|${entityName}.financierType2|"
                                th:initValue="${entity?.financierType2}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE3}">
                        </select>
                    </div>
                </div>

            </div>


            <div class="layui-form-item">


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.financierType3}">融资人类型（按经济类型划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_financierType3|" th:name="|${entityName}.financierType3|"
                                th:initValue="${entity?.financierType3}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE2}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.financeProj}">融资项目</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_financeProj|"
                               th:name="|${entityName}.financeProj|"
                               data-th-value="${entity?.financeProj}" class="layui-input form-input"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">融资人所属行业分类</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_industry1|" th:name="|${entityName}.industry1|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                                th:initValue="${entity?.industry1}"
                                th:childrenIds="|${entityName}_industryLevel2Type|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_industryLevel2Type|" th:name="|${entityName}.industryLevel2Type|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                                th:initValue="${entity?.industryLevel2Type}"
                                data-th-parentids="|${entityName}_industry1|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>

                </div>
            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">融资项目所属行业分类</label>

                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_proIndustry|" th:name="|${entityName}.proIndustry|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                                th:initValue="${entity?.proIndustry}"
                                th:childrenIds="|${entityName}_proIndustryLevel2|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_proIndustryLevel2|" th:name="|${entityName}.proIndustryLevel2|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                                th:initValue="${entity?.proIndustryLevel2}"
                                data-th-parentids="|${entityName}_proIndustry|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.industryFlag}">项目是否属于重点监控行业和领域</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_industryFlag|" th:name="|${entityName}.industryFlag|"
                                th:initValue="${entity?.industryFlag}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.monitType}">重点监控行业和领域类别</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_monitType|" th:name="|${entityName}.monitType|"
                                th:initValue="${entity?.monitType}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_MOINT_TYPE}">
                        </select>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">



                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.monTypeComm}">重点监控行业和领域类别说明</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_monTypeComm|"
                               th:name="|${entityName}.monTypeComm|"
                               data-th-value="${entity?.monTypeComm}" class="layui-input form-input"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.outGrade}">对应资产外部评级</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_outGrade|" th:name="|${entityName}.outGrade|"
                                th:initValue="${entity?.outGrade}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_MAIN_GRADE}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.guaType}">担保方式</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_guaType|" th:name="|${entityName}.guaType|"
                                th:initValue="${entity?.guaType}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_GUA_TYPE}">
                        </select>
                    </div>
                </div>

            </div>




            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.pledgeType}">抵质押物类型</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pledgeType|" th:name="|${entityName}.pledgeType|"
                                th:initValue="${entity?.pledgeType}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_PLEDGE_TYPE}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.pledgeValue}">抵质押物价值（元）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_pledgeValue|"
                               th:name="|${entityName}.pledgeValue|"
                               data-th-value="${entity?.pledgeValue}" class="layui-input form-input"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.natureGuarantee}">担保性质</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_natureGuarantee|" th:name="|${entityName}.natureGuarantee|"
                                th:initValue="${entity?.natureGuarantee}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_NATURE_GUARANTEE}">
                        </select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.relationFinan}">担保人与融资人关系</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_relationFinan|" th:name="|${entityName}.relationFinan|"
                                th:initValue="${entity?.relationFinan}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_RELATION_FINAN}">
                        </select>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.guaTypeRemark}">担保情况说明</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_guaTypeRemark|"
                               th:name="|${entityName}.guaTypeRemark|"
                               data-th-value="${entity?.guaTypeRemark}" class="layui-input form-input"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOtherInvestTargetInfo.deptEquity}">是否为债转股</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_deptEquity|" th:name="|${entityName}.deptEquity|"
                                th:initValue="${entity?.deptEquity}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

            </div>


        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var entityName_BussRepOtherInvestTargetInfo = [[${entityName}]];
    var SVR_PARTY_TYPE1_01 = /*[[${SVR_PARTY_TYPE1_01}]]*/'01';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/project/SvrBussRepOtherInvestTargetInfo.js}"
        type="text/javascript"></script>
</body>

</html>
