<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorator="~{layout/default}">
<head>
	<meta charset="utf-8">
	<title data-th-text="#{CchbPrdBaseInfo002}">新建产品基本信息</title>
</head>
<body>
<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
		<div class="pro-module-wrap">
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">产品基础信息</span>
				</h3>
				<div class="pro-module-item pro-item-wrap">
					<div class="layui-form-item">
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.prodInsId}">行内标识码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="prodInsId" name="prodInsId" class="layui-input form-input input-select"
										data-th-data-url='@{/chb/businessdatamaintain/chbprdbaseinfo/chbprdbaseinfo002/getProdInsId}'
										placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption = "false"
										data-th-initValue="${entity?.prodInsId}" required>
								</select>
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.prodId}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="prodId" id="prodId" required
									   data-th-value="${entity?.prodId}"
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap " data-th-text="#{CchbPrdBaseInfo001.prodName}">产品名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="prodName" id="prodName"
									   data-th-value="${entity?.prodName}" required
									   class="layui-input form-input" placeholder="请输入内容" disabled
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="form-inline-wrap" >
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.regCode}">产品登记编码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="regCode" id="regCode"
									   data-th-value="${entity?.regCode}" required disabled
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
						<div class="form-inline-wrap" >
							<label class="layui-form-label form-label-wrap"data-th-text="#{CchbPrdBaseInfo001.issuePartyId}">发行机构代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="issuePartyId" id="issuePartyId"
									   data-th-value="${entity?.issuePartyId}" required
									   class="layui-input form-input" placeholder="请输入内容" disabled
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
						<div class="form-inline-wrap" >
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.raiseVdate}">募集起始日期</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="raiseVdate" name="raiseVdate" required
									   data-th-value='${#dates.format(entity?.raiseVdate,"yyyy-MM-dd")}'
									   class="layui-input form-input input-dateSelect" />
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="form-inline-wrap"  >
							<label class="layui-form-label form-label-wrap " data-th-text="#{CchbPrdBaseInfo001.raiseEnddate}">募集结束日期</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="raiseEnddate" name="raiseEnddate" required
									   data-th-value='${#dates.format(entity?.raiseEnddate,"yyyy-MM-dd")}'
									   class="layui-input form-input input-dateSelect" />
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.vdate}">起息日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="vdate" name="vdate" required
									   data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
									   class="layui-input form-input input-dateSelect" />
							</div>
						</div>
						<div class="form-inline-wrap" >
							<label class="layui-form-label form-label-wrap " data-th-text="#{CchbPrdBaseInfo001.mdate}">到期日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="mdate" name="mdate" required
									   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
									   class="layui-input form-input input-dateSelect" />
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="form-inline-wrap" >
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.manageType}">管理方式</label>
							<div class="layui-input-inline input-inline">
								<select  id="manageType" name="manageType" required
										 data-th-initValue="${entity?.manageType}"
										 class="layui-input form-input input-select"
										 data-th-data-result="${SVR_PRO_STYLE}"
								></select>
							</div>
						</div>
						<div class="form-inline-wrap" >
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.yieldHigh}">业绩比较基准上限(%)</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="yieldHigh" id="yieldHigh"
									   data-th-value="${entity?.yieldHigh}" required
									   data-pattern="#.#######" data-fixtype="7" maxlength="9" onkeyup="value=value.replace(/[^\d{1,}\.\d{1,}|\d{1,}]/g,'')"
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
						<div class="form-inline-wrap" >
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.yieldLow}">业绩比较基准下限(%)</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="yieldLow" id="yieldLow"
									   data-th-value="${entity?.yieldLow}" required
									   data-pattern="#.#######" data-fixtype="7" maxlength="9" onkeyup="value=value.replace(/[^\d{1,}\.\d{1,}|\d{1,}]/g,'')"
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">发行登记</span>
				</h3>
				<div class="pro-module-item pro-item-wrap">
					<div class="layui-form-item">
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.isConstracte}">是否为结构化（分级）产品</label>
							<div class="layui-input-inline input-inline">
								<select  id="isConstracte" name="isConstracte" required
										 data-th-initValue="${entity?.isConstracte}"
										 class="layui-input form-input input-select"
										 data-th-data-result="${SVR_YES_OR_NO}"
								></select>
							</div>
						</div>
						<div class="form-inline-wrap" id="ivstorientation_div" style="display:none">

							<label class="layui-form-label form-label-wrap " data-th-text="#{CchbPrdBaseInfo001.ivstorientation}">产品投资性质</label>
							<div class="layui-input-inline input-inline">
								<select  id="ivstorientation" name="ivstorientation" required
										 data-th-initValue="${entity?.ivstorientation}"
										 class="layui-input form-input input-select"
										 data-th-data-result="${INVEST_TYPE}"
								></select>
							</div>
						</div>
						<div class="form-inline-wrap">

							<label class="layui-form-label form-label-wrap " data-th-text="#{CchbPrdBaseInfo001.gradProportion}">分级比例</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="gradProportion" id="gradProportion"
									   data-th-value="${entity?.gradProportion}"
									   data-pattern="###.#####" data-fixtype="5" maxlength="9" onkeyup="value=value.replace(/[^\d{1,}\.\d{1,}|\d{1,}]/g,'')"
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="form-inline-wrap" >
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.yieldRemark}">业绩比较基准说明</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="yieldRemark" id="yieldRemark"
									   data-th-value="${entity?.yieldRemark}" 
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>

						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"data-th-text="#{CchbPrdBaseInfo001.openMode}">开放模式</label>
							<div class="layui-input-inline input-inline">
								<select  id="openMode" name="openMode"
										 data-th-initValue="${entity?.openMode}"
										 class="layui-input form-input input-select"
										 data-th-data-result="${SVR_OPEN_MODE}"
								></select>
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.openCircle}">规律开放周期</label>
							<div class="layui-input-inline input-inline">
								<select  id="openCircle" name="openCircle"
										 data-th-initValue="${entity?.openCircle}"
										 class="layui-input form-input input-select"
										 data-th-data-result="${SVR_REGULAR_OPEN_CYCLE}"
								></select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="form-inline-wrap" >

							<label class="layui-form-label form-label-wrap " data-th-text="#{CchbPrdBaseInfo001.openCircleDays}">其他规律开放周期（天）</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="openCircleDays" id="openCircleDays"
									   data-th-value="${entity?.openCircleDays}" maxlength="6" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,'')"
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
						<div class="form-inline-wrap" id="operateMode_div" style="display: none">
							<label class="layui-form-label form-label-wrap " data-th-text="#{CchbPrdBaseInfo001.operateMode}">产品运作模式</label>
							<div class="layui-input-inline input-inline">
								<select  id="operateMode" name="operateMode"
										 data-th-initValue="${entity?.operateMode}" required
										 class="layui-input form-input input-select"
										 data-th-data-result="${SVR_OPERATEMODE_DECLARE}"
								></select>
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.fitCircleDays}">定期开放周期(天)</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="fitCircleDays" id="fitCircleDays"
									   data-th-value="${entity?.fitCircleDays}" maxlength="4" onkeyup="value=value.replace(/^(0+)|[^\d]+/g,'')"
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap " data-th-text="#{CchbPrdBaseInfo001.ruleComment}">无规律开放说明</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="ruleComment" id="ruleComment"
									   data-th-value="${entity?.ruleComment}"
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
						<div class="form-inline-wrap" >
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.firstOpenDay}">首次开放周期起始日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="firstOpenDay" name="firstOpenDay"
									   data-th-value='${#dates.format(entity?.firstOpenDay,"yyyy-MM-dd")}'
									   class="layui-input form-input input-dateSelect" />
							</div>
						</div>
						<div class="form-inline-wrap" >
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.holidayOnFlag}">节假日是否开放</label>
							<div class="layui-input-inline input-inline">
								<select  id="holidayOnFlag" name="holidayOnFlag"
										 data-th-initValue="${entity?.holidayOnFlag}"
										 class="layui-input form-input input-select"
										 data-th-data-result="${SVR_YES_OR_NO}"
								></select>
							</div>
						</div>

					</div>
					<div class="layui-form-item">
						<div class="form-inline-wrap" >
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.avgOpenCount}">平均开放次数（年化）</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="avgOpenCount" id="avgOpenCount"
									   data-th-value="${entity?.avgOpenCount}"
									   data-pattern="######.##" data-fixtype="2" maxlength="6" onkeyup="value=value.replace(/[^\d{1,}\.\d{1,}|\d{1,}]/g,'')"
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
						<div class="form-inline-wrap" >
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.openBuss}">开放期业务</label>
							<div class="layui-input-inline input-inline">
								<select  id="openBuss" name="openBuss"
										 data-th-initValue="${entity?.openBuss}"
										 class="layui-input form-input input-select"
										 data-th-data-result="${SVR_OPEN_BUSS}"
								></select>
							</div>
						</div>
						<div class="form-inline-wrap" >
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.openBussRemark}">开放期业务说明</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="openBussRemark" id="openBussRemark"
									   data-th-value="${entity?.openBussRemark}"
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>

					</div>
					<div class="layui-form-item">
							<div class="form-inline-wrap" >
								<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.prodtype}">产品类型</label>
								<div class="layui-input-inline input-inline">
									<select  id="prodtype" name="prodtype" required
											 data-th-initValue="${entity?.prodtype}"
											 class="layui-input form-input input-select"
											 data-th-data-result="${SVR_PRODTYPE}"
									></select>
								</div>
							</div>
							<div class="form-inline-wrap" >
								<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.calendarId}">产品交易日历</label>
								<div class="layui-input-inline input-inline">
									<select name="calendarId" id="calendarId"
											class="layui-input form-input input-select"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-url="@{/chb/businessdatamaintain/chbprdbaseinfo/chbprdbaseinfo001/queryCalendarInfoList}"
											data-th-initValue='${entity?.calendarId}' >
									</select>
								</div>
							</div>
							<div class="form-inline-wrap" >
								<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.issuingStatus}">发行状态</label>
								<div class="layui-input-inline input-inline">
									<select  id="issuingStatus" name="issuingStatus"
											 data-th-initValue="${entity?.issuingStatus==null?'03':entity?.issuingStatus}"
											 class="layui-input form-input input-select"
											 data-th-data-result="${SVR_ISSUING_STATUS}"
									></select>
								</div>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="form-inline-wrap" >
								<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.remark}">备注</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="remark" id="remark"
										   data-th-value="${entity?.remark}"
										   class="layui-input form-input" placeholder="请输入内容"
										   data-th-placeholder="#{SysCommon.placeholder}" >
								</div>
							</div>
					</div>
					</div>
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">募集总量登记</span>
				</h3>
				<div class="pro-module-item pro-item-wrap">
					<div class="layui-form-item">
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.busiAcctNo}">资金托管账号</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="busiAcctNo" id="busiAcctNo"
									   data-th-value="${entity?.busiAcctNo}" required
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
						<div class="form-inline-wrap">

							<label class="layui-form-label form-label-wrap " data-th-text="#{CchbPrdBaseInfo001.acctName}">资金托管账户</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="acctName" id="acctName"
									   data-th-value="${entity?.acctName}" required
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>

					</div>
				</div>
			</div>
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">终止登记</span>
				</h3>
				<div class="pro-module-item pro-item-wrap">
					<div class="layui-form-item">
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.basic}">计息基础</label>
							<div class="layui-input-inline input-inline">
								<select  id="basic" name="basic"
										 data-th-initValue="${entity?.basic}" required
										 class="layui-input form-input input-select"
										 data-th-data-result="${SVR_PROD_BASIS}"
								></select>
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap " data-th-text="#{CchbPrdBaseInfo001.terminatedate}">提前终止日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="terminatedate" name="terminatedate"
									   data-th-value='${#dates.format(entity?.terminatedate,"yyyy-MM-dd")}'
									   class="layui-input form-input input-dateSelect" />
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">非保本月报/G06</span>
				</h3>
				<div class="pro-module-item pro-item-wrap">
					<div class="layui-form-item">
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.isTransfer}">是否母行划转产品</label>
							<div class="layui-input-inline input-inline">
								<select  id="isTransfer" name="isTransfer"
										 data-th-initValue="${entity?.isTransfer}"
										 class="layui-input form-input input-select"
										 data-th-data-result="${SVR_YES_OR_NO}"
								></select>
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap" data-th-text="#{CchbPrdBaseInfo001.cashManaCate}">是否现金管理类</label>
							<div class="layui-input-inline input-inline">
								<select  id="cashManaCate" name="cashManaCate"
										 data-th-initValue="${entity?.cashManaCate}"
										 class="layui-input form-input input-select" required
										 data-th-data-result="${SVR_YES_OR_NO}"
								></select>
							</div>
						</div>
						<div class="form-inline-wrap">

							<label class="layui-form-label form-label-wrap " data-th-text="#{CchbPrdBaseInfo001.manaCateFit}" >现金管理类产品-是否完全符合</label>
							<div class="layui-input-inline input-inline">
								<select  id="manaCateFit" name="manaCateFit"
										 data-th-initValue="${entity?.manaCateFit}"
										 class="layui-input form-input input-select"
										 data-th-data-result="${SVR_YES_OR_NO}"
								></select>
							</div>
