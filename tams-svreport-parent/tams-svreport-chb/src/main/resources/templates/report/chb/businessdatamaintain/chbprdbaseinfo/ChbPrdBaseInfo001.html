<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<meta charset="UTF-8">
<title data-th-text="#{CchbPrdBaseInfo001}">产品基本信息</title>
</head>
<body>
	<div layout:fragment="content">
		<!-- 画面内容 -->
		<div class="form-button-area" >
			<a id="CchbPrdBaseInfo001_btn_add" class="layui-btn layui-btn-sm btn-create"
			   data-th-text="#{SysCommon.create}">新建</a>
			<a id="CchbPrdBaseInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
			   data-th-text="#{SysCommon.delete}">删除</a>
			<a id="CchbPrdBaseInfo001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
			<a id="CchbPrdBaseInfo001_btn_issueStatusMan" class="layui-btn layui-btn-sm btn-import btn-default">发行状态管理</a>
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">

				<div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable" data-th-text="#{CchbPrdBaseInfo001.prodId}">产品代码</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="prodId"
								   class="layui-input form-input input-lenovoselect " placeholder="请输入内容"
								   data-th-placeholder="#{SysCommon.placeholder}"
								   data-th-data-url="@{/chb/businessdatamaintain/chbprdbaseinfo/chbprdbaseinfo001/getProdIdAndProdName}"
								   data-idfield="code" data-keyfield="code"
								   data-th-data-effectivefieldsalias='|{"code":"#{CchbPrdBaseInfo001.prodId}","shortName":"#{CchbPrdBaseInfo001.prodName}"}|'>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable" data-th-text="#{CchbPrdBaseInfo001.prodName}">产品名称</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="prodName"
								   class="layui-input form-input input-lenovoselect " placeholder="请输入内容"
								   data-th-placeholder="#{SysCommon.placeholder}"
								   data-th-data-url="@{/chb/businessdatamaintain/chbprdbaseinfo/chbprdbaseinfo001/getProdIdAndProdName}"
								   data-idfield="shortName" data-keyfield="shortName"
								   data-th-data-effectivefieldsalias='|{"code":"#{CchbPrdBaseInfo001.prodId}","shortName":"#{CchbPrdBaseInfo001.prodName}"}|'>
						</div>
					</div>
					<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable" data-th-text="#{CchbPrdBaseInfo001.regCode}">产品登记编码</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="regCode"
								   class="layui-input form-input" placeholder="请选择"
								   allowClear="true">
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable" data-th-text="#{CchbPrdBaseInfo001.raiseVdate}">募集起始日期</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="raiseVdate"
								   class="layui-input form-input input-dateRangeSelect">
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable" data-th-text="#{CchbPrdBaseInfo001.vdate}">起息日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="vdate"
								   class="layui-input form-input input-dateRangeSelect">
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable" data-th-text="#{CchbPrdBaseInfo001.customerType}">客户类型</label>
						<div class="layui-input-inline input-inline">
							<select id="customerType"  class="input-select" multiple="true"
								   data-th-data-result="${SVR_CUSTOMER_TYPE}" placeholder="请选择" allowClear="true">
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable" data-th-text="#{CchbPrdBaseInfo001.issuingStatus}">发行状态</label>
						<div class="layui-input-inline input-inline">
							<select id="issuingStatus"  class="input-select" multiple="true"
								   data-th-data-result="${SVR_ISSUING_STATUS}" placeholder="请选择" allowClear="true">
							</select>
						</div>
					</div>
				</div>
			</form>
		</div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
	</div>

	<div layout:fragment="script">
		<script data-th-src="@{/js/report/chb/businessdatamaintain/chbprdbaseinfo/ChbPrdBaseInfo001.js}"
				type="text/javascript"></script>
	</div>
</body>
</html>
