<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .buss-inline-wrap .select2-container {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">另类资产</span>（<span class="star-sign">*</span>必填）<i
                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepOthKindInfo.countryArea}">所属国家或地区</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_countryArea|" th:name="|${entityName}.countryArea|"
                                data-th-data-result="${SVR_COUNTRY_AREA}" th:initValue="${entity?.countryArea}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable" >名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetName|" th:name="|${entityName}.assetName|"
                               class="layui-input form-input"
                               data-th-value="${entity?.assetName}" required>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepOthKindInfo.assetValue}">资产价值</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetValue|" th:name="|${entityName}.assetValue|"
                               required="required"
                               th:value="${entity?.assetValue}" data-textrange="2"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" th:id="|${entityName}_investRate_div|">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepOthKindInfo.assetYield}">资产收益率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetYield|" th:name="|${entityName}.assetYield|"
                               th:value="${entity?.assetYield}"
                               class="layui-input form-input text-number" data-textrange="5"/>
                        <span class="input-right-show">%</span>
                    </div>
                </div>
            </div>

            <!--add by yjp 估值穿透开发--监管报送资产基本信息维护导入功能合并华夏字段start -->
            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType1}" >新人行一级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType1|" th:name="|${entityName}.pbcAssetType1|" th:initValue="${entity?.pbcAssetType1}"
                                th:childrenIds="|${entityName}_pbcAssetType2|" required
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_1}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType2}" >新人行二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType2|" th:name="|${entityName}.pbcAssetType2|" th:initValue="${entity?.pbcAssetType2}"
                                th:childrenIds="|${entityName}_pbcAssetType3|" th:parentIds="|${entityName}_pbcAssetType1|" required
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_2}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType3}" >新人行三级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType3|" th:name="|${entityName}.pbcAssetType3|" th:initValue="${entity?.pbcAssetType3}"
                                th:parentIds="|${entityName}_pbcAssetType2|" required
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_3}">
                        </select>
                    </div>
                </div>

            </div>
            <!--add by yjp 估值穿透开发--监管报送资产基本信息维护导入功能合并华夏字段 end -->

                <div class="layui-form-item">
                    <div class="form-inline-wrap" style="width: 100% !important;">
                        <label class="layui-form-label form-label-wrap"
                               data-th-utext="#{SvrBussRepOthKindInfo.remark}" style="width: 12.55%;">备注</label>
                        <div class="layui-input-inline input-inline" style="width: 86% !important;">
                            <input th:id="|${entityName}_remark|" th:name="|${entityName}.remark|"
                                   placeholder="请输入内容" class="layui-input form-input"
                                   data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.remark}"
                                   maxlength="128" style="width: 100%!important;">
                            </input>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script data-th-inline="javascript" type="text/javascript">
        var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
        var entityName = /*[[${entityName}]]*/'';
        var FLAG_YES = /*[[${FLAG_YES}]]*/'';
    </script>
    <script data-th-src="@{/js/report/chb/assetinfodetail/asset/othKind/SvrBussRepOthKindInfo.js}"
            type="text/javascript"></script>
</body>

</html>
