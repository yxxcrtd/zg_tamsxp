<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title>流动性风险应对情况信息维护新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm" style="margin-bottom: 20px;">
        <input type="text"  id="seqno" name="seqno" data-th-value="${entity?.seqno}"  hidden/>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">产品代码</label>
                <div class="layui-input-inline input-inline">
                    <select id="prodId" name="prodId" data-th-data-url='@{/svreport/system/proregistcodemanage/ProRegistCodeManage001/getProdID}' data-th-initValue="${entity?.prodId}" data-th-data-formatoption=true data-th-data-parentids="orgCode" class="input-select" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" required="required">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">产品登记编码</label>
                <div class="layui-input-inline input-inline">
                    <input id="regCode" name="regCode"  data-th-value="${entity?.regCode}"  class="layui-input form-input" disabled="disabled" required="required"/>
                </div>
            </div>
        </div>
        <div class="layui-form-item" >
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">流动性风险应对措施</label>
                <div class="layui-input-inline input-inline">
                    <select id="solutions" name="solutions" class="layui-input form-input input-select" data-th-data-result='${LIQUIDITY_RISK_TYPE}' data-th-initValue='${entity?.solutions}' placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" required="required">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">风险发生日期</label>
                <div class="layui-input-inline input-inline">
                    <input id="occurDate" type="text"  name="occurDate"   data-th-value='${#dates.format(entity?.occurDate,"yyyy-MM-dd")}' class="layui-input form-input input-dateSelect" placeholder="请选择日期" required="required"/>
                </div>
            </div>
        </div>
        <div class="layui-form-item" >
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">风险应对日期</label>
                <div class="layui-input-inline input-inline">
                    <input id="replyDate" type="text"  name="replyDate"   data-th-value='${#dates.format(entity?.replyDate,"yyyy-MM-dd")}' class="layui-input form-input input-dateSelect" placeholder="请选择日期" required="required"/>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">风险事件描述</label>
                <div class="layui-input-inline input-inline">
                    <input id="described" type="text"  name="described"   data-th-value="${entity?.described}" class="layui-input form-input" placeholder="请输入关键词" />
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">风险处理结果</label>
                <div class="layui-input-inline input-inline">
                    <input id="disposeResult" type="text"  name="disposeResult"   data-th-value="${entity?.disposeResult}" class="layui-input form-input" placeholder="请输入关键词" />
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable">备注</label>
                <div class="layui-input-inline input-inline">
                    <input id="remark" type="text"  name="remark"   data-th-value="${entity?.remark}" class="layui-input form-input" placeholder="请输入关键词" />
                </div>
            </div>
        </div>
    </form>
    <div class="row text-center" style="height: 30px">
        <a id="LiquidityRiskInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
        <a id="LiquidityRiskInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/report/chb/liquidityriskinfo/LiquidityRiskInfo002.js}" type="text/javascript"></script>
</div>
</body>
</html>
