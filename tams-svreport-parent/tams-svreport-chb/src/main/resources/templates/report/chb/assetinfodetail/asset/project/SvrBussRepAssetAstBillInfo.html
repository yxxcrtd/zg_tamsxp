<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:id="|${entityName}_div|" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">中债资产要素信息——票据/ 信用证类资产</span></h3>
        <div class="pro-module-item">

            <div class="layui-form-item" >
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.isRight}">是否为收/受益权</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_isRight|" th:name="|${entityName}.isRight|"
                                th:initValue="${entity?.isRight}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.isResale}">是否属于买入返售</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_isResale|" th:name="|${entityName}.isResale|"
                                th:initValue="${entity?.isResale}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.notstandSecType}">类型</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_notstandSecType|" th:name="|${entityName}.notstandSecType|"
                                th:initValue="${entity?.notstandSecType}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                parentIds="assetType2"
                                data-th-data-result="${SVR_ASSET_TYPE_BILL_LETTERCREDIT}">
                        </select>
                    </div>
                </div>

            </div>


            <div class="layui-form-item">


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepAssetAstBillInfo.isBzhpj}">是否标准化票据</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_isBzhpj|" th:name="|${entityName}.isBzhpj|"
                                th:initValue="${entity?.isBzhpj}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepAssetAstBillInfo.billCode}">票据代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_billCode|"
                               th:name="|${entityName}.billCode|" data-th-value="${entity?.billCode}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.notstandSecNum}">数量</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_notstandSecNum|" th:name="|${entityName}.notstandSecNum|"
                               required="required"
                               th:value="${entity?.notstandSecNum}" data-textrange="0" maxlength="6"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>



            </div>




            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.amt}">合计金额</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_amt|" th:name="|${entityName}.amt|"
                               required="required"
                               th:value="${entity?.amt}" data-textrange="2"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.remainTerm}">加权剩余期限（天）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_remainTerm|" th:name="|${entityName}.remainTerm|"
                               th:value="${entity?.remainTerm}" data-textrange="2" required="required"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.maxRemainTerm}">最长剩余期限（天）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_maxRemainTerm|"
                               th:name="|${entityName}.maxRemainTerm|" required="required"
                               th:value="${entity?.maxRemainTerm}" data-textrange="0"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>


            </div>



            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.minRemainTerm}">最短剩余期限（天）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_minRemainTerm|"
                               th:name="|${entityName}.minRemainTerm|" required="required"
                               th:value="${entity?.minRemainTerm}" data-textrange="0"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">起息日</label>
                    <div class="layui-input-inline input-inline">

                        <input type="text" disabled="true"
                               th:id="|${entityName}_vdate|"
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>


                <div class="form-inline-wrap" >
                    <label class="layui-form-label form-label-wrap ">到期日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" disabled="true"
                               th:id="|${entityName}_mdate|"
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>

            </div>

            <!--add by yjp 估值穿透开发--监管报送资产基本信息维护导入功能合并华夏字段start -->
            <div class="layui-form-item">


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepAssetAstBillInfo.assetYield}">贴现利率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetYield|" th:name="|${entityName}.assetYield|"
                               th:value="${entity?.assetYield}"
                               class="layui-input form-input text-number" required="required" data-textrange="5"/>
                        <span class="input-right-show">%</span>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">行业</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_industryShares|" th:name="|${entityName}.industryShares|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                                th:initValue="${entity?.industryShares}"
                                th:childrenIds="|${entityName}_industryShares2|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_industryShares2|" th:name="|${entityName}.industryShares2|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                                th:initValue="${entity?.industryShares2}"
                                data-th-parentids="|${entityName}_industryShares|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var entityName_BussRepAssetAstBillInfo = /*[[${entityName}]]*/'';
    var CHB_ASSET_TYPE_PROJECT_1201 = /*[[${CHB_ASSET_TYPE_PROJECT_1201}]]*/'';
    var CHB_ASSET_TYPE_PROJECT_1210 = /*[[${CHB_ASSET_TYPE_PROJECT_1210}]]*/'';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/project/SvrBussRepAssetAstBillInfo.js}"
        type="text/javascript"></script>
</body>

</html>
