<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .buss-inline-wrap .select2-container {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">中债资产要素信息——QDII股票/基金类资产</span></h3>
        <div class="pro-module-item">

            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussQDIISharesInfo.countryArea}">所属国家或地区</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_countryArea|" th:name="|${entityName}.countryArea|"
                                data-th-data-result="${SVR_COUNTRY_AREA}" th:initValue="${entity?.countryArea}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>



                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIISharesInfo.assetId}">股票/基金代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetId|"  disabled="disabled"
                               th:name="|${entityName}.assetId|" data-th-value="${entity?.assetId}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-utext="#{SvrBussQDIISharesInfo.assetName}">股票/基金名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetName|"
                               th:name="|${entityName}.assetName|" disabled="disabled"
                               th:value="${entity?.assetName}"
                               data-fixtype="2" class="layui-input form-input" required/>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIISharesInfo.issuePartyName}">发行机构</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_issuePartyName|"
                                th:name="|${entityName}.issuePartyName|"
                                th:initValue="${entity?.issuePartyName}"
                                class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/common/select/getTrusterId}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">行业</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_industryShares|" th:name="|${entityName}.industryShares|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                                th:initValue="${entity?.industryShares}"
                                th:childrenIds="|${entityName}_industryShares2|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_industryShares2|" th:name="|${entityName}.industryShares2|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                                th:initValue="${entity?.industryShares2}"
                                data-th-parentids="|${entityName}_industryShares|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>



            </div>

        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
    var entityName = /*[[${entityName}]]*/'';
    var FLAG_YES = /*[[${FLAG_YES}]]*/'';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/qdiiShares/SvrBussQDIISharesInfo.js}"
        type="text/javascript"></script>
</body>
</html>
