<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
<style>
.buss-inline-wrap .select2-container{
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
</style>
</head>
<body>
<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">中债资产要素信息——QDII结构性票据类资产</span></h3>
        <div class="pro-module-item">
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepQDIIStructureInfo.countryArea}">所属国家或地区</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${entityName}_countryArea|" th:name="|${entityName}.countryArea|" data-th-data-result="${SVR_COUNTRY_AREA}" th:initValue="${entity?.countryArea}" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepQDIIStructureInfo.contractName}">合约名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_contractName|" th:name="|${entityName}.contractName|" th:value="${entity?.contractName}" class="layui-input form-input" maxlength="32" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" disabled="true" required/>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap">起息日</label>
					<div class="layui-input-inline input-inline">

						<input type="text" disabled="true"
							   th:id="|${entityName}_vdate|"
							   class="layui-input form-input input-dateSelect" />
					</div>
				</div>

			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap" >
					<label class="layui-form-label form-label-wrap ">到期日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" disabled="true"
							   th:id="|${entityName}_mdate|"
							   class="layui-input form-input input-dateSelect" />
					</div>
				</div>
				<div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepQDIIStructureInfo.assetYield}">票面利率%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_assetYield|" th:name="|${entityName}.assetYield|"   th:value="${entity?.assetYield}"
							   class="layui-input form-input text-number" data-textrange="5"/>
					</div>
				</div>

				<div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepQDIIStructureInfo.intpayCycle}">付息频率（个月/次）</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_intpayCycle|" th:name="|${entityName}.intpayCycle|"   th:value="${entity?.intpayCycle}"
							   class="layui-input form-input text-number" data-textrange="0"/>
					</div>
				</div>

			</div>
			<div class="layui-form-item">

				<div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepQDIIStructureInfo.incomeRatio}">固定收益部分所占比例%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_incomeRatio|" th:name="|${entityName}.incomeRatio|"   th:value="${entity?.incomeRatio}"  required
							   class="layui-input form-input text-number" data-textrange="5"/>
					</div>
				</div>
				<div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepQDIIStructureInfo.derInstrRatio}">衍生金融工具所占比例%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_derInstrRatio|" th:name="|${entityName}.derInstrRatio|"   th:value="${entity?.derInstrRatio}"  required
							   class="layui-input form-input text-number" data-textrange="5"/>
					</div>
				</div>

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepQDIIStructureInfo.derInstrInvType}">衍生金融工具具体投资方式</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_derInstrInvType|" th:name="|${entityName}.derInstrInvType|" th:value="${entity?.derInstrInvType}" class="layui-input form-input" maxlength="300" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
					</div>
				</div>

			</div>
			<div class="layui-form-item">

				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepQDIIStructureInfo.derInstrTarget}">衍生金融工具挂钩标的资产</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_derInstrTarget|" th:name="|${entityName}.derInstrTarget|" th:value="${entity?.derInstrTarget}" class="layui-input form-input" maxlength="200" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepQDIIStructureInfo.acctMode}">利息结算方式</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_acctMode|" th:name="|${entityName}.acctMode|" th:value="${entity?.acctMode}" class="layui-input form-input" maxlength="200" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepQDIIStructureInfo.specialCmt1}">含权情况说明</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_specialCmt1|" th:name="|${entityName}.specialCmt1|" th:value="${entity?.specialCmt1}" class="layui-input form-input" maxlength="200" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required/>
					</div>
				</div>

			</div>
			<div class="layui-form-item">

				<div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepQDIIStructureInfo.maxYield}">结构性票据最高收益率%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_maxYield|" th:name="|${entityName}.maxYield|"   th:value="${entity?.maxYield}"  required
							   class="layui-input form-input text-number" data-textrange="5"/>
					</div>
				</div>
				<div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepQDIIStructureInfo.minYield}">结构性票据最低收益率%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_minYield|" th:name="|${entityName}.minYield|"   th:value="${entity?.minYield}"
							   class="layui-input form-input text-number" data-textrange="5"/>
					</div>
				</div>
				<div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepQDIIStructureInfo.basicPrice}">挂钩标的资产基准价格</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_basicPrice|" th:name="|${entityName}.basicPrice|"   th:value="${entity?.basicPrice}"
							   class="layui-input form-input text-number" data-textrange="2"/>
					</div>
				</div>

			</div>

			<div class="layui-form-item">


				<div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
					<label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepQDIIStructureInfo.regDatePrice}">挂钩标的资产登记日价格</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_regDatePrice|" th:name="|${entityName}.regDatePrice|"   th:value="${entity?.regDatePrice}"
							   required
							   class="layui-input form-input text-number" data-textrange="2"/>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussRepQDIIStructureInfo.tradeFee}">交易费</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${entityName}_tradeFee|" th:name="|${entityName}.tradeFee|" th:value="${entity?.tradeFee}" class="layui-input form-input" maxlength="200" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required />
					</div>
				</div>

			</div>

        </div>
    </div>
</div>
<SCRIPT DATA-TH-INLINE="JAVASCRIPT" TYPE="TEXT/JAVASCRIPT">
	var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
	var entityName = /*[[${entityName}]]*/'';
	var FLAG_YES = /*[[${FLAG_YES}]]*/'';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/qdiiStructure/SvrBussRepQDIIStructureInfo.js}" type="text/javascript"></script>
</body>

</html>
