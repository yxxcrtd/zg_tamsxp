<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .buss-inline-wrap .select2-container {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">中债资产要素信息——QDII债券资产</span></h3>
        <div class="pro-module-item">


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussQDIIBondRepInfo.countryArea}">所属国家或地区</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_countryArea|" th:name="|${entityName}.countryArea|"
                                data-th-data-result="${SVR_COUNTRY_AREA}" th:initValue="${entity?.countryArea}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-utext="#{SvrBussQDIIBondRepInfo.assetName}">债券名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetName|"
                               th:name="|${entityName}.assetName|"
                               th:value="${entity?.assetName}" disabled="disabled"
                               data-fixtype="2" class="layui-input form-input" required/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.assetId}">债券代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetId|"
                               th:name="|${entityName}.assetId|" data-th-value="${entity?.assetId}"
                               class="layui-input form-input" placeholder="请输入内容" disabled="disabled"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.issuePartyName}">发行机构</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_issuePartyName|"
                                th:name="|${entityName}.issuePartyName|"
                                data-th-initvalue="${entity?.issuePartyName}"
                                class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/common/select/getTrusterId}">
                        </select>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">发行机构所属行业</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_industry|" th:name="|${entityName}.industry|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                                th:initValue="${entity?.industry}"
                                th:childrenIds="|${entityName}_industryLevel2|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_industryLevel2|" th:name="|${entityName}.industryLevel2|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                                th:initValue="${entity?.industryLevel2}"
                                data-th-parentids="|${entityName}_industry|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">起息日</label>
                    <div class="layui-input-inline input-inline">

                        <input type="text" disabled="true"
                               th:id="|${entityName}_vdate|"
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>

            </div>


            <div class="layui-form-item">


                <div class="form-inline-wrap" >
                    <label class="layui-form-label form-label-wrap ">到期日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" disabled="true"
                               th:id="|${entityName}_mdate|"
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>

                <div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussQDIIBondRepInfo.termMonth}">期限（月）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_termMonth|" th:name="|${entityName}.termMonth|"
                               th:value="${entity?.termMonth}" required
                               class="layui-input form-input text-number" data-textrange="0"/>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussQDIIBondRepInfo.partyGrade}">发行机构主体信用评级</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_partyGrade|" th:name="|${entityName}.partyGrade|"
                               data-th-value="${entity?.partyGrade}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" required>


                    </div>
                </div>


            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.secCreditGradeType}">债券信用评级</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_secCreditGradeType|"
                               th:name="|${entityName}.secCreditGradeType|"
                               data-th-value="${entity?.secCreditGradeType}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>

                <div class="form-inline-wrap" th:id="|${entityName}_investRate_div|">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.assetYield}">票面利率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetYield|" th:name="|${entityName}.assetYield|"
                               th:value="${entity?.assetYield}"
                               class="layui-input form-input text-number" required="required" data-textrange="5"/>
                        <span class="input-right-show">%</span>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.intpayCycle}">付息频率（个月/次）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_intpayCycle|" th:name="|${entityName}.intpayCycle|"
                               data-th-value="${entity?.intpayCycle}"
                               class="layui-input form-input text-number" placeholder="请输入内容" data-textrange="0"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>


            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width:100%;">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.guaTypeRemark}"
                           style=" width: 11.9%;">担保情况说明</label>
                    <div class="layui-input-inline input-inline" style="width:81%!important;">
                            <textarea th:id="|${entityName}_guaTypeRemark|" th:name="|${entityName}.guaTypeRemark|"
                                      th:value="${entity?.guaTypeRemark}" data-th-text="${entity?.guaTypeRemark}"
                                      class="layui-textarea"
                                      placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required="required"></textarea>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width:100%;">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.specialCmt}"
                           style=" width: 11.9%;">是否含权等特殊条款情况说明</label>
                    <div class="layui-input-inline input-inline" style="width:81%!important;">
                            <textarea th:id="|${entityName}_specialCmt|" th:name="|${entityName}.specialCmt|"
                                      th:value="${entity?.specialCmt}" data-th-text="${entity?.specialCmt}"
                                      class="layui-textarea"
                                      placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required="required"></textarea>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
    var entityName = /*[[${entityName}]]*/'';
    var FLAG_YES = /*[[${FLAG_YES}]]*/'';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/qdiiBond/SvrBussQDIIBondRepInfo.js}"
        type="text/javascript"></script>
</body>
</html>
