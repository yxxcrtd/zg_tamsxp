<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .buss-inline-wrap .select2-container {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="pro-module-wrap" th:id="|${entityName}_div|">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">QDII债券</span>（<span class="star-sign">*</span>必填）<i
                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussQDIIBondRepInfo.countryArea}">所属国家或地区</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_countryArea|" th:name="|${entityName}.countryArea|"
                                data-th-data-result="${SVR_COUNTRY_AREA}" th:initValue="${entity?.countryArea}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-utext="#{SvrBussQDIIBondRepInfo.assetName}">债券名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetName|"
                               th:name="|${entityName}.assetName|"
                               th:value="${entity?.assetName}" disabled="disabled"
                               data-fixtype="2" class="layui-input form-input" required/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.assetId}">债券代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetId|"
                               th:name="|${entityName}.assetId|" data-th-value="${entity?.assetId}"
                               class="layui-input form-input" placeholder="请输入内容" disabled="disabled"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.issuePartyName}">发行机构</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_issuePartyName|"
                               th:name="|${entityName}.issuePartyName|" data-th-value="${entity?.issuePartyName}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussQDIIBondRepInfo.industry}">发行机构所属一级行业</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_industry|" th:name="|${entityName}.industry|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                                th:initValue="${entity?.industry}"
                                th:childrenIds="|${entityName}_industryLevel2|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussQDIIBondRepInfo.industryLevel2}">发行机构所属二级行业</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_industryLevel2|" th:name="|${entityName}.industryLevel2|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                                th:initValue="${entity?.industryLevel2}"
                                data-th-parentids="|${entityName}_industry|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap" th:id="|${entityName}_rate_div|">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussQDIIBondRepInfo.termMonth}">期限（月）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_termMonth|" th:name="|${entityName}.termMonth|"
                               th:value="${entity?.termMonth}" required
                               class="layui-input form-input text-number" data-textrange="0"/>
                    </div>
                </div>


                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussQDIIBondRepInfo.partyGrade}">发行机构主体信用评级</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_partyGrade|" th:name="|${entityName}.partyGrade|"
                               data-th-value="${entity?.partyGrade}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.secCreditGradeType}">债券信用评级</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_secCreditGradeType|"
                               th:name="|${entityName}.secCreditGradeType|"
                               data-th-value="${entity?.secCreditGradeType}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap" th:id="|${entityName}_investRate_div|">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.assetYield}">票面利率%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetYield|" th:name="|${entityName}.assetYield|"
                               th:value="${entity?.assetYield}"
                               class="layui-input form-input text-number" required="required" data-textrange="5"/>
                        <span class="input-right-show">%</span>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.intpayCycle}">付息频率（个月/次）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_intpayCycle|" th:name="|${entityName}.intpayCycle|"
                               data-th-value="${entity?.intpayCycle}"
                               class="layui-input form-input text-number" placeholder="请输入内容" data-textrange="0"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.guaTypeRemark}">担保情况说明</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_guaTypeRemark|"
                               th:name="|${entityName}.guaTypeRemark|" data-th-value="${entity?.guaTypeRemark}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussQDIIBondRepInfo.specialCmt}">是否含权等特殊条款情况说明</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_specialCmt|"
                               th:name="|${entityName}.specialCmt|" data-th-value="${entity?.specialCmt}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>
            </div>
            <!--add by yjp 估值穿透开发--监管报送资产基本信息维护导入功能合并华夏字段start -->
            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType1}" >新人行一级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType1|" th:name="|${entityName}.pbcAssetType1|" th:initValue="${entity?.pbcAssetType1}"
                                th:childrenIds="|${entityName}_pbcAssetType2|" required
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_1}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType2}" >新人行二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType2|" th:name="|${entityName}.pbcAssetType2|" th:initValue="${entity?.pbcAssetType2}"
                                th:childrenIds="|${entityName}_pbcAssetType3|" th:parentIds="|${entityName}_pbcAssetType1|" required
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_2}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType3}" >新人行三级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType3|" th:name="|${entityName}.pbcAssetType3|" th:initValue="${entity?.pbcAssetType3}"
                                th:parentIds="|${entityName}_pbcAssetType2|" required
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_3}">
                        </select>
                    </div>
                </div>

            </div>
            <!--add by yjp 估值穿透开发--监管报送资产基本信息维护导入功能合并华夏字段end -->
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width: 100% !important;">
                    <label class="layui-form-label form-label-wrap" data-th-utext="#{SvrBussQDIIBondRepInfo.remark}"
                           style="width: 12.55%;">备注</label>
                    <div class="layui-input-inline input-inline" style="width: 86% !important;">
                        <input th:id="|${entityName}_remark|" th:name="|${entityName}.remark|" placeholder="请输入内容"
                               class="layui-input form-input" data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${entity?.remark}"  maxlength="128" style="width: 100%!important;">


                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var TRADE_MARKET_99 = /*[[${TRADE_MARKET_99}]]*/'';
    var entityName = /*[[${entityName}]]*/'';
    var FLAG_YES = /*[[${FLAG_YES}]]*/'';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/qdiiBond/SvrBussQDIIBondRepInfo.js}"
        type="text/javascript"></script>
</body>
</html>
