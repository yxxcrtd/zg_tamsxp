<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:id="|${entityName}_div|" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des"
                                           data-th-text="#{BussRepEquityInfo}">权益类资产报送信息</span>（<span class="star-sign">*</span>必填）<i
                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
        <div class="pro-module-item">
            <input id="type8" name="type8" th:value="8" hidden>
            <input th:id="|${entityName}_finprodType2|" th:name="|${entityName}.finprodType2|"
                   th:value="${INT_ASSET_TYPE}" hidden>


            <div class="layui-form-item" th:id="|${entityName}_content_one_div|">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepEquityInfo.assetId}">股票代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetId|" th:name="|${entityName}.assetId|"
                               data-th-value="${entity?.assetId}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" >
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-utext="#{SvrBussRepEquityInfo.assetName}">股票/企业名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetName|"
                               th:value="${entity?.assetName}" disabled="disabled"
                               data-fixtype="2" class="layui-input form-input" required/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepEquityInfo.sharesType}">股票类型</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_sharesType|" th:name="|${entityName}.sharesType|"
                                th:initValue="${entity?.sharesType}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_SHARES_TYPE}">
                        </select>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepEquityInfo.industryShares}">行业一级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="equityindustryShares" th:name="|${entityName}.industryShares|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                                th:initValue="${entity?.industryShares}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                childrenIds="equityindustryShares2"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-utext="#{SvrBussRepEquityInfo.industryShares2}">行业二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="equityindustryShares2" th:name="|${entityName}.industryShares2|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                                th:initValue="${entity?.industryShares2}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                parentIds="equityindustryShares"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepEquityInfo.investStage}">投资阶段</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_investStage|" th:name="|${entityName}.investStage|"
                                th:initValue="${entity?.investStage}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_INVEST_STAGE}">
                        </select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap" th:id="|${entityName}_repEquityQuit_div|">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepEquityInfo.equityQuit}">股权退出安排</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_equityQuit|" th:name="|${entityName}.equityQuit|"
                               data-th-value='${#dates.format(entity?.equityQuit,"yyyy-MM-dd")}'
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepEquityInfo.sharesType1}">企业类型（按规模划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_sharesType1|" th:name="|${entityName}.sharesType1|"
                                th:initValue="${entity?.sharesType1}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE1}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepEquityInfo.sharesType3}">企业类型（按技术领域划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_sharesType3|" th:name="|${entityName}.sharesType3|"
                                th:initValue="${entity?.sharesType3}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE3}">
                        </select>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepEquityInfo.sharesType2}">企业类型（按经济类型划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_sharesType2|" th:name="|${entityName}.sharesType2|"
                                th:initValue="${entity?.sharesType2}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE2}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepEquityInfo.isPledge}">是否为质押融资</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_isPledge|" th:name="|${entityName}.isPledge|"
                                class="layui-input form-input input-select"
                                th:initValue='${entity?.isPledge eq null ? "02" : entity?.isPledge}'
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required disabled="disabled"
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>


                <!--<div class="layui-form-item"> -->
                <!-- start  modify by wj  20200407 增加   是否债转股 是否银行优先股 -->
                <div class="form-inline-wrap" >
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepEquityInfo.deptEquity}">是否为债转股(权益类资产)</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_deptEquity|" th:name="|${entityName}.deptEquity|"
                                th:initValue="${entity?.deptEquity}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">

            <div class="form-inline-wrap" >
                <label class="layui-form-label form-label-wrap"
                       data-th-text="#{SvrBussRepEquityInfo.bankSecPrefer}">是否商业银行优先股</label>
                <div class="layui-input-inline input-inline">
                    <select th:id="|${entityName}_bankSecPrefer|" th:name="|${entityName}.bankSecPrefer|"
                            th:initValue="${entity?.bankSecPrefer}" class="layui-input form-input input-select"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-result="${SVR_YES_OR_NO}">
                    </select>
                </div>
            </div>
                <!--add by yjp 估值穿透开发--监管报送资产基本信息维护导入功能合并华夏字段start -->
                <div class="form-inline-wrap" >
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepEquityInfo.ispioneer}">是否创业投资基金</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_isGovernFund|" th:name="|${entityName}.isGovernFund|"
                                th:initValue="${entity?.isGovernFund}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap" >
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepEquityInfo.isunlisted}">是否政府出资产业投资基金</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_isunlisted|" th:name="|${entityName}.isunlisted|"
                                th:initValue="${entity?.isunlisted}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>

            </div>



            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repPppflag}">公共PPP</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pppflag|" th:name="|${entityName}.pppflag|"
                                th:initValue="${entity?.pppflag}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_YES_OR_NO}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepAssetCreditNonstdInfo.repBondtostockFlag}">是否投向市场化债转股相关产品的部分</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_bondtostockFlag|" th:name="|${entityName}.bondtostockFlag|"
                                th:initValue="${entity?.bondtostockFlag}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SVR_YES_OR_NO}" required>
                        </select>
                    </div>
                </div>

            </div>


            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" >结构化业务类型</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_constracteBusiType|" th:name="|${entityName}.constracteBusiType|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:initValue="${entity?.constracteBusiType}"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_CONSTRACTE_BUSI_TYPE}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" >结构化层级</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_constracteGrade|" th:name="|${entityName}.constracteGrade|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:initValue="${entity?.constracteGrade}"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_CONSTRACTE_GRADE}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" >结构化杠杆倍数</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_constracteHeaverTimes|" th:name="|${entityName}.constracteHeaverTimes|"
                               th:value="${entity?.constracteHeaverTimes}" data-textrange="2" maxlength="6"
                               class="layui-input form-input text-number"/>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType1}" >新人行一级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType1|" th:name="|${entityName}.pbcAssetType1|" th:initValue="${entity?.pbcAssetType1}"
                                th:childrenIds="|${entityName}_pbcAssetType2|" required
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_1}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType2}" >新人行二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType2|" th:name="|${entityName}.pbcAssetType2|" th:initValue="${entity?.pbcAssetType2}"
                                th:childrenIds="|${entityName}_pbcAssetType3|" th:parentIds="|${entityName}_pbcAssetType1|" required
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_2}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepDepositInfo.pbcAssetType3}" >新人行三级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_pbcAssetType3|" th:name="|${entityName}.pbcAssetType3|" th:initValue="${entity?.pbcAssetType3}"
                                th:parentIds="|${entityName}_pbcAssetType2|" required
                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${SVR_PBC_ASSET_TYPE_3}">
                        </select>
                    </div>
                </div>

            </div>
            <!--add by yjp 估值穿透开发--监管报送资产基本信息维护导入功能合并华夏字段end -->
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width:100%;">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepEquityInfo.remark}"
                           style=" width: 12.55%;">备注</label>
                    <div class="layui-input-inline input-inline" style="width:81%!important;">
                        <input th:id="|${entityName}_remark|" th:name="|${entityName}.remark|"
                               th:value="${entity?.remark}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"></input>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var entityName_BussRepEquityInfo = /*[[${entityName}]]*/'';
    var initgp = [[${gp}]];
    var initentity = [[${entityName}]];
    var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F18'; //项目类资产类型code
    var SVR_PARTY_TYPE1_01 = /*[[${SVR_PARTY_TYPE1_01}]]*/'01';
    var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'F01';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/project/SvrBussRepEquityInfo.js}"
        type="text/javascript"></script>
</body>

</html>
