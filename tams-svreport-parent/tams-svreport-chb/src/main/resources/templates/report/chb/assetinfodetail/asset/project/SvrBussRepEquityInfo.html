<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:id="|${entityName}_div|" class="pro-module-wrap">
    <div class="pro-module">
        <h3 class="pro-module-title"><span class="title-des">中债资产要素信息——权益类资产</span></h3>
        <div class="pro-module-item">
            <input id="type8" name="type8" th:value="8" hidden>
            <input th:id="|${entityName}_finprodType2|" th:name="|${entityName}.finprodType2|"
                   th:value="${INT_ASSET_TYPE}" hidden>


            <div class="layui-form-item" th:id="|${entityName}_content_one_div|">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepEquityInfo.assetId}">股票代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetId|" th:name="|${entityName}.assetId|"
                               data-th-value="${entity?.assetId}"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" >
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-utext="#{SvrBussRepEquityInfo.assetName}">股票/企业名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_assetName|"
                               th:value="${entity?.assetName}" disabled="disabled"
                               data-fixtype="2" class="layui-input form-input" required/>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepEquityInfo.sharesType}">股票类型</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_sharesType|" th:name="|${entityName}.sharesType|"
                                th:initValue="${entity?.sharesType}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_SHARES_TYPE}">
                        </select>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">行业</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_industryShares|" th:name="|${entityName}.industryShares|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
                                th:initValue="${entity?.industryShares}"
                                th:childrenIds="|${entityName}_industryShares2|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                    <div class="layui-input-inline input-inline buss-inline-wrap"
                         style="width: 30%!important;display: inline-block;">
                        <select th:id="|${entityName}_industryShares2|" th:name="|${entityName}.industryShares2|"
                                data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
                                th:initValue="${entity?.industryShares2}"
                                data-th-parentids="|${entityName}_industryShares|"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required>
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepEquityInfo.investStage}">投资阶段</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_investStage|" th:name="|${entityName}.investStage|"
                                th:initValue="${entity?.investStage}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SVR_INVEST_STAGE}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap" th:id="|${entityName}_repEquityQuit_div|">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepEquityInfo.equityQuit}">股权退出安排</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" th:id="|${entityName}_equityQuit|" th:name="|${entityName}.equityQuit|"
                               data-th-value='${#dates.format(entity?.equityQuit,"yyyy-MM-dd")}'
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>

            </div>

            <div class="layui-form-item">



                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepEquityInfo.sharesType1}">企业类型（按规模划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_sharesType1|" th:name="|${entityName}.sharesType1|"
                                th:initValue="${entity?.sharesType1}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE1}">
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepEquityInfo.sharesType3}">企业类型（按技术领域划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_sharesType3|" th:name="|${entityName}.sharesType3|"
                                th:initValue="${entity?.sharesType3}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE3}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepEquityInfo.sharesType2}">企业类型（按经济类型划分）</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_sharesType2|" th:name="|${entityName}.sharesType2|"
                                th:initValue="${entity?.sharesType2}"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_PARTY_TYPE2}">
                        </select>
                    </div>
                </div>
            </div>


            <div class="layui-form-item">



                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{SvrBussRepEquityInfo.isPledge}">是否为质押融资</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_isPledge|" th:name="|${entityName}.isPledge|"
                                class="layui-input form-input input-select"
                                th:initValue='${entity?.isPledge eq null ? "02" : entity?.isPledge}'
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>


                <!--<div class="layui-form-item"> -->
                <!-- start  modify by wj  20200407 增加   是否债转股 是否银行优先股 -->
                <div class="form-inline-wrap" >
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{SvrBussRepEquityInfo.deptEquity}">是否为债转股</label>
                    <div class="layui-input-inline input-inline">
                        <select th:id="|${entityName}_deptEquity|" th:name="|${entityName}.deptEquity|"
                                th:initValue="${entity?.deptEquity}" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                                data-th-data-result="${SVR_YES_OR_NO}">
                        </select>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script data-th-inline="javascript" type="text/javascript">
    var entityName_BussRepEquityInfo = /*[[${entityName}]]*/'';
    var initgp = [[${gp}]];
    var initentity = [[${entityName}]];
    var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F18'; //项目类资产类型code
    var SVR_PARTY_TYPE1_01 = /*[[${SVR_PARTY_TYPE1_01}]]*/'01';
    var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'F01';
</script>
<script data-th-src="@{/js/report/chb/assetinfodetail/asset/project/SvrBussRepEquityInfo.js}"
        type="text/javascript"></script>
</body>

</html>
