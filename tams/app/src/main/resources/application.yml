    addresses: 192.168.90.118:5672
    username: joyin
    password: joyin123
    publisher-confirms: true
    publisher-returns: true
    listener:
      simple:
        max-concurrency: 20
        concurrency: 1
        acknowledge-mode: manual
        retry:
          enabled: true
    template:
      retry:
        enabled: false
      mandatory: true
  activemq:
    active: false
    systemId: tams
    brokerUrl: tcp://localhost:61616
    user: system
    password: manager
    maximumRedeliveries: 10
    initialRedeliveryDelay: 1
    backOffMultiplier: 2
    useExponentialBackOff: true
    maximumRedeliveryDelay: -1
