<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskValTableQuery001}">估值表查询</title>
    <style>
        .layui-table tbody tr:hover, .layui-table thead tr, .layui-table-click, .layui-table-header, .layui-table-hover, .layui-table-mend, .layui-table-patch, .layui-table-tool, .layui-table[lay-even] tr:nth-child(even){
            background-color: #d9ecff!important;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area"></div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">估值日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id='fileDate' name='fileDate'
                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value='${platDate}' required="required">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">估值表名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="fileName" name="fileName"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/risk/valtblimport/RskValTableQuery001/getFileName}"
                                allowClear="true"
                                formatoption=true multiple>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">估值表表头</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="fileHeader" name="fileHeader"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/risk/valtblimport/RskValTableQuery001/getFileHeader}"
                                allowClear="true"
                                formatoption=true multiple>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">标识名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="subCode" name="subCode"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/risk/valtblimport/RskValTableQuery001/getSubCode}"
                                allowClear="true"
                                formatoption=true multiple>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">资产/负债一级类别</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="subOneCat" name="subOneCat"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                th:data-result='${ASSETS_DEBTS_ONE}'
                                 allowClear="true"
                                formatoption=true multiple>

                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">资产/负债二级类别</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="subTwoCat" name="subTwoCat"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                th:data-result='${ASSETS_DEBTS_TWO}' allowClear="true"
                                formatoption=true multiple>

                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var platDate = /*[[${platDate}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/risk/valtblimport/RskValTableQuery001.js}" type="text/javascript"></script>
</div>
</body>
</html>
